name: Build Arabic Puzzle Game APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Arabic Puzzle Game APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Generate Game and Android Project Code
        run: |
          python3 - << 'PY_EOF'
          import os

          os.makedirs("app/src/main/java/com/ammar/alghaz", exist_ok=True)
          os.makedirs("app/src/main/res/drawable", exist_ok=True)
          os.makedirs("app/src/main/res/values", exist_ok=True)
          os.makedirs("app/src/main/assets", exist_ok=True)

          with open("settings.gradle", "w", encoding="utf-8") as f:
              f.write('''pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "AlghazGame"
          include ':app'
          ''')

          with open("build.gradle", "w", encoding="utf-8") as f:
              f.write('''plugins {
              id 'com.android.application' version '8.2.2' apply false
          }
          ''')

          with open("gradle.properties", "w", encoding="utf-8") as f:
              f.write('''org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          ''')

          with open("app/build.gradle", "w", encoding="utf-8") as f:
              f.write('''plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.ammar.alghaz'
              compileSdk 34

              defaultConfig {
                  applicationId "com.ammar.alghaz"
                  minSdk 21
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }

              buildTypes {
                  release {
                      minifyEnabled false
                      proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
                  }
                  debug {
                      debuggable true
                  }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }

          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
          }
          ''')

          with open("app/src/main/AndroidManifest.xml", "w", encoding="utf-8") as f:
              f.write('''<?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.VIBRATE" />

              <application
                  android:allowBackup="true"
                  android:icon="@drawable/ic_launcher"
                  android:roundIcon="@drawable/ic_launcher"
                  android:label="@string/app_name"
                  android:supportsRtl="true"
                  android:hardwareAccelerated="true"
                  android:theme="@style/Theme.App">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:configChanges="orientation|screenSize|screenLayout|keyboardHidden"
                      android:screenOrientation="portrait">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.action.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          ''')

          with open("app/src/main/res/values/strings.xml", "w", encoding="utf-8") as f:
              f.write('''<resources>
              <string name="app_name">عالم الألغاز</string>
          </resources>
          ''')

          with open("app/src/main/res/values/styles.xml", "w", encoding="utf-8") as f:
              f.write('''<resources>
              <style name="Theme.App" parent="Theme.AppCompat.Light.NoActionBar">
                  <item name="android:windowBackground">#0b132b</item>
                  <item name="android:statusBarColor">#0b132b</item>
              </style>
          </resources>
          ''')

          with open("app/src/main/res/drawable/ic_launcher.xml", "w", encoding="utf-8") as f:
              f.write('''<vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path
                  android:fillColor="#1c2541"
                  android:pathData="M0,0h108v108h-108z"/>
              <path
                  android:fillColor="#f59e0b"
                  android:pathData="M54,20 A34,34 0 1,0 54,88 A34,34 0 1,0 54,20 Z"/>
              <path
                  android:fillColor="#ffffff"
                  android:pathData="M54,32 C48,32 44,36 44,42 L50,42 C50,39 52,37 54,37 C56.5,37 58.5,39 58.5,41.5 C58.5,44 57,45.5 54.5,47.5 C51.5,50 49.5,52.5 49.5,58 L55.5,58 C55.5,54 57.5,52 60,50 C63,47.5 64.5,45 64.5,41.5 C64.5,36 59.8,32 54,32 Z M51,64 L57,64 L57,70 L51,70 Z"/>
          </vector>
          ''')

          with open("app/src/main/java/com/ammar/alghaz/MainActivity.java", "w", encoding="utf-8") as f:
              f.write('''package com.ammar.alghaz;

          import android.annotation.SuppressLint;
          import android.app.AlertDialog;
          import android.content.Context;
          import android.os.Build;
          import android.os.Bundle;
          import android.os.VibrationEffect;
          import android.os.Vibrator;
          import android.webkit.JavascriptInterface;
          import android.webkit.WebChromeClient;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import androidx.appcompat.app.AppCompatActivity;

          public class MainActivity extends AppCompatActivity {
              private WebView webView;

              @SuppressLint("SetJavaScriptEnabled")
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  
                  if (getSupportActionBar() != null) {
                      getSupportActionBar().hide();
                  }

                  webView = new WebView(this);
                  setContentView(webView);

                  WebSettings settings = webView.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setDatabaseEnabled(true);
                  settings.setAllowFileAccess(true);
                  settings.setCacheMode(WebSettings.LOAD_DEFAULT);
                  settings.setUseWideViewPort(true);
                  settings.setLoadWithOverviewMode(true);
                  settings.setSupportZoom(false);
                  settings.setDisplayZoomControls(false);

                  webView.addJavascriptInterface(new WebAppInterface(this), "AndroidBridge");
                  webView.setWebChromeClient(new WebChromeClient());
                  webView.setWebViewClient(new WebViewClient());

                  webView.loadUrl("file:///android_asset/index.html");
              }

              public class WebAppInterface {
                  Context mContext;

                  WebAppInterface(Context c) {
                      mContext = c;
                  }

                  @JavascriptInterface
                  public void vibrate(long milliseconds) {
                      try {
                          Vibrator v = (Vibrator) getSystemService(Context.VIBRATOR_SERVICE);
                          if (v != null && v.hasVibrator()) {
                              if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                                  v.vibrate(VibrationEffect.createOneShot(milliseconds, VibrationEffect.DEFAULT_AMPLITUDE));
                              } else {
                                  v.vibrate(milliseconds);
                              }
                          }
                      } catch (Exception ignored) {}
                  }
              }

              @Override
              public void onBackPressed() {
                  if (webView != null && webView.canGoBack()) {
                      webView.goBack();
                  } else {
                      new AlertDialog.Builder(this)
                          .setTitle("الخروج من اللعبة")
                          .setMessage("هل ترغب حقاً في إغلاق اللعبة الآن؟")
                          .setPositiveButton("نعم", (dialog, which) -> finish())
                          .setNegativeButton("إلغاء", null)
                          .show();
                  }
              }
          }
          ''')

          with open("app/src/main/assets/index.html", "w", encoding="utf-8") as f:
              f.write('''<!DOCTYPE html>
          <html lang="ar" dir="rtl">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
            <title>عالم الألغاز والذكاء</title>
            <style>
              :root {
                --bg: #0b132b;
                --card-bg: rgba(28, 37, 65, 0.95);
                --card-border: rgba(255, 255, 255, 0.1);
                --text: #ffffff;
                --text-muted: #94a3b8;
                --primary: #3b82f6;
                --primary-hover: #2563eb;
                --accent-gold: #f59e0b;
                --accent-green: #10b981;
                --accent-red: #ef4444;
                --accent-purple: #8b5cf6;
                --modal-bg: rgba(15, 23, 42, 0.95);
                --font-scale: 1;
              }

              body.light-theme {
                --bg: #f1f5f9;
                --card-bg: rgba(255, 255, 255, 0.96);
                --card-border: rgba(0, 0, 0, 0.1);
                --text: #0f172a;
                --text-muted: #64748b;
                --modal-bg: rgba(255, 255, 255, 0.98);
              }

              body.font-large { --font-scale: 1.15; }
              body.font-xlarge { --font-scale: 1.3; }

              * {
                box-sizing: border-box;
                margin: 0;
                padding: 0;
                user-select: none;
                -webkit-tap-highlight-color: transparent;
                font-family: 'Segoe UI', Tahoma, Cairo, system-ui, -apple-system, sans-serif;
              }

              body {
                background-color: var(--bg);
                color: var(--text);
                min-height: 100vh;
                display: flex;
                flex-direction: column;
                overflow-x: hidden;
                transition: background-color 0.3s ease, color 0.3s ease;
                font-size: calc(16px * var(--font-scale));
              }

              header {
                position: sticky;
                top: 0;
                z-index: 100;
                background: var(--card-bg);
                backdrop-filter: blur(12px);
                border-bottom: 1px solid var(--card-border);
                padding: 12px 18px;
                display: flex;
                justify-content: space-between;
                align-items: center;
                box-shadow: 0 4px 20px rgba(0,0,0,0.25);
              }

              .header-logo {
                display: flex;
                align-items: center;
                gap: 8px;
                font-size: 1.15rem;
                font-weight: 700;
                color: var(--accent-gold);
              }

              .header-actions {
                display: flex;
                align-items: center;
                gap: 10px;
              }

              .coins-badge {
                display: flex;
                align-items: center;
                gap: 6px;
                background: rgba(245, 158, 11, 0.15);
                border: 1px solid rgba(245, 158, 11, 0.4);
                color: var(--accent-gold);
                padding: 6px 12px;
                border-radius: 20px;
                font-weight: 700;
                font-size: 0.95rem;
              }

              .icon-btn {
                background: rgba(255, 255, 255, 0.08);
                border: 1px solid var(--card-border);
                color: var(--text);
                width: 40px;
                height: 40px;
                border-radius: 50%;
                display: flex;
                align-items: center;
                justify-content: center;
                cursor: pointer;
                font-size: 1.2rem;
                transition: transform 0.2s, background 0.2s;
              }
              .icon-btn:active { transform: scale(0.92); }
              .icon-btn.gift-ready {
                animation: pulse-ring 1.8s infinite;
                border-color: var(--accent-gold);
              }

              @keyframes pulse-ring {
                0% { box-shadow: 0 0 0 0 rgba(245, 158, 11, 0.6); }
                70% { box-shadow: 0 0 0 10px rgba(245, 158, 11, 0); }
                100% { box-shadow: 0 0 0 0 rgba(245, 158, 11, 0); }
              }

              main {
                flex: 1;
                padding: 16px;
                max-width: 600px;
                margin: 0 auto;
                width: 100%;
              }

              .view-title {
                font-size: 1.3rem;
                font-weight: 800;
                margin-bottom: 6px;
                text-align: center;
              }
              .view-subtitle {
                font-size: 0.9rem;
                color: var(--text-muted);
                text-align: center;
                margin-bottom: 18px;
              }

              .stages-grid {
                display: flex;
                flex-direction: column;
                gap: 14px;
              }

              .stage-card {
                background: var(--card-bg);
                border: 1px solid var(--card-border);
                border-radius: 16px;
                padding: 16px;
                display: flex;
                align-items: center;
                gap: 14px;
                cursor: pointer;
                transition: transform 0.2s, box-shadow 0.2s, border-color 0.2s;
              }
              .stage-card:active { transform: scale(0.98); }
              .stage-card.locked {
                opacity: 0.65;
                cursor: not-allowed;
                filter: grayscale(0.7);
              }
              .stage-card.unlocked {
                border-color: rgba(59, 130, 246, 0.4);
                box-shadow: 0 4px 15px rgba(59, 130, 246, 0.15);
              }
              .stage-card.passed { border-color: rgba(16, 185, 129, 0.5); }
              .stage-card.mastered {
                border-color: rgba(245, 158, 11, 0.7);
                background: linear-gradient(135deg, var(--card-bg), rgba(245, 158, 11, 0.1));
              }

              .stage-icon {
                font-size: 2.2rem;
                width: 54px;
                height: 54px;
                border-radius: 14px;
                background: rgba(255, 255, 255, 0.06);
                display: flex;
                align-items: center;
                justify-content: center;
                flex-shrink: 0;
              }

              .stage-info { flex: 1; }
              .stage-title {
                font-weight: 700;
                font-size: 1.05rem;
                margin-bottom: 4px;
              }
              .stage-desc {
                font-size: 0.8rem;
                color: var(--text-muted);
                margin-bottom: 8px;
                line-height: 1.3;
              }
              .stage-progress-bar {
                height: 6px;
                background: rgba(255, 255, 255, 0.1);
                border-radius: 4px;
                overflow: hidden;
                margin-bottom: 4px;
              }
              .stage-progress-fill {
                height: 100%;
                background: linear-gradient(90deg, var(--primary), var(--accent-green));
                border-radius: 4px;
                transition: width 0.4s ease;
              }
              .stage-card.mastered .stage-progress-fill {
                background: linear-gradient(90deg, var(--accent-gold), #f97316);
              }
              .stage-status-text {
                font-size: 0.75rem;
                color: var(--text-muted);
                display: flex;
                justify-content: space-between;
              }

              .stage-header-box {
                background: var(--card-bg);
                border: 1px solid var(--card-border);
                border-radius: 18px;
                padding: 16px;
                margin-bottom: 16px;
              }
              .back-btn {
                background: transparent;
                border: none;
                color: var(--accent-gold);
                display: inline-flex;
                align-items: center;
                gap: 6px;
                font-weight: 700;
                cursor: pointer;
                margin-bottom: 8px;
                font-size: 0.95rem;
              }
              .rule-badge {
                display: inline-block;
                background: rgba(59, 130, 246, 0.15);
                border: 1px solid rgba(59, 130, 246, 0.4);
                color: #60a5fa;
                padding: 4px 10px;
                border-radius: 12px;
                font-size: 0.8rem;
                margin-top: 6px;
                font-weight: 600;
              }

              .puzzles-grid {
                display: grid;
                grid-template-columns: repeat(2, 1fr);
                gap: 12px;
                margin-bottom: 20px;
              }

              .puzzle-card {
                background: var(--card-bg);
                border: 1px solid var(--card-border);
                border-radius: 16px;
                padding: 14px;
                display: flex;
                flex-direction: column;
                justify-content: space-between;
                min-height: 140px;
                cursor: pointer;
                transition: transform 0.2s, box-shadow 0.2s, border-color 0.2s;
              }
              .puzzle-card:active { transform: scale(0.96); }
              .puzzle-card.solved {
                border-color: rgba(16, 185, 129, 0.6);
                background: linear-gradient(145deg, var(--card-bg), rgba(16, 185, 129, 0.08));
              }
              .puzzle-way-num {
                font-size: 0.75rem;
                font-weight: 700;
                padding: 2px 8px;
                border-radius: 8px;
                background: rgba(255, 255, 255, 0.08);
                width: fit-content;
                margin-bottom: 6px;
              }
              .puzzle-card-title {
                font-weight: 700;
                font-size: 0.95rem;
                margin-bottom: 4px;
              }
              .puzzle-card-cat {
                font-size: 0.75rem;
                color: var(--text-muted);
              }
              .puzzle-card-status {
                align-self: flex-start;
                margin-top: 10px;
                font-size: 0.8rem;
                font-weight: 700;
                display: flex;
                align-items: center;
                gap: 4px;
              }
              .puzzle-card.solved .puzzle-card-status { color: var(--accent-green); }
              .puzzle-card:not(.solved) .puzzle-card-status { color: var(--accent-gold); }

              .modal-overlay {
                position: fixed;
                top: 0; left: 0; right: 0; bottom: 0;
                background: rgba(0, 0, 0, 0.75);
                backdrop-filter: blur(8px);
                z-index: 500;
                display: none;
                align-items: center;
                justify-content: center;
                padding: 16px;
              }
              .modal-overlay.active { display: flex; animation: fadeIn 0.25s ease-out; }
              .modal-box {
                background: var(--modal-bg);
                border: 1px solid var(--card-border);
                border-radius: 20px;
                width: 100%;
                max-width: 500px;
                max-height: 90vh;
                overflow-y: auto;
                padding: 22px;
                box-shadow: 0 10px 40px rgba(0,0,0,0.5);
                animation: slideUp 0.3s cubic-bezier(0.16, 1, 0.3, 1);
              }
              @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
              @keyframes slideUp { from { transform: translateY(30px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

              .modal-header {
                display: flex;
                justify-content: space-between;
                align-items: center;
                margin-bottom: 16px;
                padding-bottom: 12px;
                border-bottom: 1px solid var(--card-border);
              }
              .modal-title {
                font-size: 1.15rem;
                font-weight: 800;
                display: flex;
                align-items: center;
                gap: 8px;
              }
              .close-modal-btn {
                background: rgba(255, 255, 255, 0.1);
                border: none;
                color: var(--text);
                width: 32px;
                height: 32px;
                border-radius: 50%;
                display: flex;
                align-items: center;
                justify-content: center;
                font-size: 1rem;
                cursor: pointer;
              }

              .puzzle-question-text {
                font-size: 1.15rem;
                font-weight: 700;
                line-height: 1.5;
                text-align: center;
                margin: 16px 0 20px;
                padding: 12px;
                background: rgba(255, 255, 255, 0.04);
                border-radius: 12px;
              }

              .options-list {
                display: flex;
                flex-direction: column;
                gap: 10px;
                margin-bottom: 16px;
              }
              .option-btn {
                background: rgba(255, 255, 255, 0.06);
                border: 1px solid var(--card-border);
                color: var(--text);
                padding: 14px 16px;
                border-radius: 12px;
                font-size: 1rem;
                font-weight: 600;
                text-align: right;
                cursor: pointer;
                transition: all 0.2s;
              }
              .option-btn:hover:not(:disabled) {
                background: rgba(59, 130, 246, 0.2);
                border-color: var(--primary);
              }
              .option-btn.correct {
                background: rgba(16, 185, 129, 0.25) !important;
                border-color: var(--accent-green) !important;
                color: #34d399 !important;
              }
              .option-btn.wrong {
                background: rgba(239, 68, 68, 0.25) !important;
                border-color: var(--accent-red) !important;
                color: #f87171 !important;
              }
              .option-btn.hidden {
                visibility: hidden;
                pointer-events: none;
              }

              .scramble-slots {
                display: flex;
                justify-content: center;
                gap: 8px;
                margin-bottom: 20px;
                direction: rtl;
              }
              .scramble-slot {
                width: 44px;
                height: 48px;
                border: 2px dashed rgba(255, 255, 255, 0.3);
                border-radius: 10px;
                display: flex;
                align-items: center;
                justify-content: center;
                font-size: 1.3rem;
                font-weight: 800;
                background: rgba(255, 255, 255, 0.04);
                color: var(--accent-gold);
              }
              .scramble-slot.filled {
                border-style: solid;
                border-color: var(--primary);
                background: rgba(59, 130, 246, 0.15);
              }
              .scramble-keyboard {
                display: flex;
                flex-wrap: wrap;
                justify-content: center;
                gap: 8px;
                margin-bottom: 16px;
              }
              .letter-btn {
                width: 44px;
                height: 46px;
                background: rgba(255, 255, 255, 0.1);
                border: 1px solid var(--card-border);
                border-radius: 10px;
                color: var(--text);
                font-size: 1.25rem;
                font-weight: 700;
                cursor: pointer;
                display: flex;
                align-items: center;
                justify-content: center;
              }
              .letter-btn:active { transform: scale(0.9); }
              .letter-btn.used {
                opacity: 0.3;
                pointer-events: none;
              }
              .scramble-controls {
                display: flex;
                justify-content: center;
                gap: 12px;
                margin-bottom: 14px;
              }
              .action-sub-btn {
                background: rgba(255, 255, 255, 0.08);
                border: 1px solid var(--card-border);
                color: var(--text);
                padding: 8px 16px;
                border-radius: 10px;
                font-size: 0.9rem;
                font-weight: 600;
                cursor: pointer;
              }

              .timer-container {
                width: 100%;
                height: 10px;
                background: rgba(255, 255, 255, 0.1);
                border-radius: 5px;
                overflow: hidden;
                margin-bottom: 16px;
              }
              .timer-fill {
                height: 100%;
                background: linear-gradient(90deg, var(--accent-red), var(--accent-gold), var(--accent-green));
                width: 100%;
                transition: width 1s linear;
              }
              .tf-buttons-row {
                display: grid;
                grid-template-columns: 1fr 1fr;
                gap: 14px;
                margin-bottom: 16px;
              }
              .tf-btn {
                padding: 16px;
                border-radius: 14px;
                font-size: 1.2rem;
                font-weight: 800;
                cursor: pointer;
                border: none;
                display: flex;
                align-items: center;
                justify-content: center;
                gap: 8px;
              }
              .tf-btn:active { transform: scale(0.95); }
              .tf-true {
                background: linear-gradient(135deg, #10b981, #059669);
                color: white;
              }
              .tf-false {
                background: linear-gradient(135deg, #ef4444, #dc2626);
                color: white;
              }

              .connection-words-grid {
                display: grid;
                grid-template-columns: 1fr 1fr;
                gap: 10px;
                margin-bottom: 18px;
              }
              .connection-word-box {
                background: rgba(139, 92, 246, 0.15);
                border: 1px solid rgba(139, 92, 246, 0.4);
                padding: 12px;
