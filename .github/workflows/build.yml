          echo "تم بناء ملفات اللعبة بنجاح."

      - name: تجميع ملف التطبيق (Build APK)
        run: |
          ./gradle-8.5/bin/gradle assembleDebug --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk Ammar-Arabic-Puzzle-Game-v1.0.apk
          ls -lh Ammar-Arabic-Puzzle-Game-v1.0.apk

      - name: رفع ملف التطبيق كملف قابل للتحميل (Upload APK Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: Ammar-Arabic-Puzzle-Game-APK
          path: Ammar-Arabic-Puzzle-Game-v1.0.apk
          retention-days: 30

      - name: ملخص تقرير البناء (Step Summary)
        run: |
          echo "### 🎮 تم بناء لعبة الألغاز العربية بنجاح! 🚀" >> $GITHUB_STEP_SUMMARY
          echo "- **تصميم وبرمجة:** عمار الهلالي" >> $GITHUB_STEP_SUMMARY
          echo "- **عدد المستويات:** 50 مستوى متدرج الصعوبة" >> $GITHUB_STEP_SUMMARY
          echo "- **نظام الألغاز:** 12 طريقة لغز يتم اختيار 6 منها عشوائياً لكل مرحلة" >> $GITHUB_STEP_SUMMARY
          echo "- **اسم الملف:** \`Ammar-Arabic-Puzzle-Game-v1.0.apk\`" >> $GITHUB_STEP_SUMMARY
