                    { type: "math", title: "تفكير حسابي", icon: "🔢", desc: "أولويات العمليات", question: "احسب بسرعة ناتج العملية الحسابية: 9 × 8 - 12", options: ["60", "62", "58", "64"], answerIndex: 0 },
                    { type: "obs", title: "دقة ملاحظة", icon: "👁️", desc: "اختلاف دقيق", question: "أي من هذه الساعات تشير إلى وقت مختلف عن باقي الساعات؟", items: ["🕒", "🕒", "🕒", "🕒", "🕓", "🕒", "🕒", "🕒", "🕒", "🕒", "🕒", "🕒"], correctIndex: 4 },
                    { type: "trivia", title: "شتى المجالات", icon: "🌍", desc: "تاريخ وبطولة", question: "من هو القائد العربي العظيم الملقب بـ 'سيف الله المسلول'؟", options: ["خالد بن الوليد", "طارق بن زياد", "صلاح الدين الأيوبي", "سعد بن أبي وقاص"], answerIndex: 0 },
                    { type: "riddle", title: "سرعة ومرونة", icon: "⚡", desc: "لغز محير", question: "له عين واحدة في رأسه ولكنه لا يرى بها شيئاً على الإطلاق.. فما هو؟", options: ["الإبرة", "الإعصار", "الكاميرا", "الباب"], answerIndex: 0 }
                  ]
                },
                {
                  id: 5,
                  title: "المرحلة الخامسة: تاج الحكمة",
                  modes: [
                    { type: "word", title: "ثروة لغوية", icon: "🔤", desc: "مفردات سداسية", question: "المركبة الصاروخية التي تنقل رواد الفضاء خارج كوكب الأرض:", answer: "الصاروخ", tiles: ["ا", "ل", "ص", "ا", "ر", "و", "خ", "م", "ك", "و", "ك", "ن"] },
                    { type: "memory", title: "قوة الذاكرة", icon: "🧠", desc: "مطابقة البطاقات", question: "تحدي الذاكرة النهائي: طابق رموز الفنون والموسيقى والألعاب!", pairs: ["🎨", "🎭", "🎪", "🎯", "🎲", "🎸"] },
                    { type: "math", title: "تفكير حسابي", icon: "🔢", desc: "لغز الأعمار", question: "إذا كان عمر أحمد 12 عاماً وعمر والده 3 أمثاله، فكم عمر الوالد؟", options: ["36 عاماً", "32 عاماً", "40 عاماً", "48 عاماً"], answerIndex: 0 },
                    { type: "obs", title: "دقة ملاحظة", icon: "👁️", desc: "عين ثاقبة", question: "ابحث عن القلب المكسور بين القلوب الحمراء السليمة:", items: ["❤️", "❤️", "❤️", "❤️", "❤️", "❤️", "❤️", "❤️", "💔", "❤️", "❤️", "❤️"], correctIndex: 8 },
                    { type: "trivia", title: "شتى المجالات", icon: "🌍", desc: "عالم الحيوان", question: "ما هو أسرع حيوان بري على وجه الأرض عند الركض؟", options: ["الفهد الصياد", "الغزال البري", "الحصان العربي", "الأسد"], answerIndex: 0 },
                    { type: "riddle", title: "سرعة ومرونة", icon: "⚡", desc: "لغز التفكير المرن", question: "شيء موجود في وسط 'باريس'، وما بين 'السماء' و'الأرض'؟", options: ["حرف الراء", "الهواء النقي", "أشعة الشمس", "الغيوم"], answerIndex: 0 }
                  ]
                }
              ];

              const Game = {
                coins: 300,
                stars: 0,
                currentStageIndex: 0,
                currentModeIndex: 0,
                currentScreen: "map",
                progress: {},
                settings: { sound: true, vibe: true },
                wordState: { answer: "", entered: [], disabledTileIdxs: [] },
                memoryState: { flipped: [], matchedCount: 0, locked: false },

                init() {
                  this.loadStorage();
                  this.updateHeaderUI();
                  this.renderStagesMap();
                },
                loadStorage() {
                  try {
                    const s = localStorage.getItem("alghaz_ammar_data");
                    if (s) {
                      const d = JSON.parse(s);
                      this.coins = d.coins ?? 300;
                      this.stars = d.stars ?? 0;
                      this.progress = d.progress ?? {};
                      this.settings = d.settings ?? { sound: true, vibe: true };
                    }
                  } catch(e) {}
                  SoundEngine.enabled = this.settings.sound;
                  this.syncSettingsToggles();
                },
                saveStorage() {
                  try {
                    localStorage.setItem("alghaz_ammar_data", JSON.stringify({
                      coins: this.coins,
                      stars: this.stars,
                      progress: this.progress,
                      settings: this.settings
                    }));
                  } catch(e) {}
                },
                updateHeaderUI() {
                  document.getElementById("player-coins").innerText = this.coins;
                  document.getElementById("player-stars").innerText = this.stars;
                },
                showScreen(id) {
                  ["screen-map", "screen-stage-hub", "screen-challenge"].forEach(s => document.getElementById(s).classList.add("hidden"));
                  document.getElementById(id).classList.remove("hidden");
                  this.currentScreen = id;
                },
                goBack() {
                  SoundEngine.tap();
                  if (this.currentScreen === "screen-challenge") this.showStageHub(this.currentStageIndex);
                  else if (this.currentScreen === "screen-stage-hub") { this.renderStagesMap(); this.showScreen("screen-map"); }
                },
                renderStagesMap() {
                  const container = document.getElementById("stages-map-container");
                  container.innerHTML = "";
                  let totalStars = 0;
                  GAME_STAGES.forEach((st, idx) => {
                    const prog = this.progress[idx] || { solvedModes: [], passed: false, stars: 0 };
                    totalStars += (prog.stars || 0);
                    const isUnlocked = idx === 0 || (this.progress[idx - 1] && this.progress[idx - 1].passed);
                    const node = document.createElement("div");
                    node.className = `stage-badge-node ${isUnlocked ? "" : "locked"}`;
                    node.innerHTML = `
                      <div class="stage-num">${isUnlocked ? (idx + 1) : "🔒"}</div>
                      <div style="font-size: 11px; font-weight: 800; color: #795548;">المرحلة ${idx + 1}</div>
                      <div class="stage-stars">${"⭐".repeat(prog.stars || 0)}</div>
                    `;
                    if (isUnlocked) node.onclick = () => { SoundEngine.tap(); this.showStageHub(idx); };
                    container.appendChild(node);
                  });
                  this.stars = totalStars;
                  this.updateHeaderUI();
                },
                showStageHub(stageIdx) {
                  this.currentStageIndex = stageIdx;
                  const st = GAME_STAGES[stageIdx];
                  const prog = this.progress[stageIdx] || { solvedModes: [], passed: false, stars: 0 };
                  document.getElementById("hub-stage-title").innerText = st.title;
                  document.getElementById("pass-criteria-text").innerText = `تم حل ${prog.solvedModes.length} من 6 طرق (يلزم 5 على الأقل لاجتياز المرحلة)`;
                  for (let i = 0; i < 6; i++) {
                    const step = document.getElementById(`step-${i}`);
                    if (prog.solvedModes.includes(i)) step.classList.add("done");
                    else step.classList.remove("done");
                  }
                  const grid = document.getElementById("modes-grid-container");
                  grid.innerHTML = "";
                  st.modes.forEach((m, mIdx) => {
                    const isDone = prog.solvedModes.includes(mIdx);
                    const card = document.createElement("div");
                    card.className = `mode-card ${isDone ? "completed" : ""}`;
                    card.innerHTML = `
                      <div class="badge-icon">${m.icon}</div>
                      <div class="mode-name">${m.title}</div>
                      <div class="mode-desc">${m.desc}</div>
                      <div class="mode-tag">${isDone ? "مكتمل ✓" : "ابدأ التحدي"}</div>
                    `;
                    card.onclick = () => { SoundEngine.tap(); this.startChallenge(stageIdx, mIdx); };
                    grid.appendChild(card);
                  });
                  this.showScreen("screen-stage-hub");
                },
                startChallenge(stageIdx, modeIdx) {
                  this.currentStageIndex = stageIdx;
                  this.currentModeIndex = modeIdx;
                  const mode = GAME_STAGES[stageIdx].modes[modeIdx];
                  document.getElementById("challenge-mode-badge").querySelector("span:first-child").innerText = mode.icon;
                  document.getElementById("challenge-mode-name").innerText = mode.title;
                  document.getElementById("challenge-category").innerText = mode.desc;
                  document.getElementById("challenge-question-text").innerText = mode.question;
                  ["container-mode-word", "container-mode-memory", "container-mode-options", "container-mode-obs"].forEach(id => {
                    document.getElementById(id).classList.add("hidden");
                  });
                  if (mode.type === "word") this.setupWordMode(mode);
                  else if (mode.type === "memory") this.setupMemoryMode(mode);
                  else if (mode.type === "obs") this.setupObsMode(mode);
                  else this.setupOptionsMode(mode);
                  this.showScreen("screen-challenge");
                },
                setupWordMode(mode) {
                  document.getElementById("container-mode-word").classList.remove("hidden");
                  this.wordState = { answer: mode.answer, entered: [], tiles: [...mode.tiles], disabledTileIdxs: [] };
                  this.renderWordUI();
                },
                renderWordUI() {
                  const slots = document.getElementById("word-slots-container");
                  slots.innerHTML = "";
                  for (let i = 0; i < this.wordState.answer.length; i++) {
                    const val = this.wordState.entered[i]?.char || "";
                    const s = document.createElement("div");
                    s.className = `letter-slot ${val ? "filled" : ""}`;
                    s.innerText = val;
                    s.onclick = () => { if (this.wordState.entered[i]) this.removeWordLetterAt(i); };
                    slots.appendChild(s);
                  }
                  const hex = document.getElementById("hex-keyboard-container");
                  hex.innerHTML = "";
                  this.wordState.tiles.forEach((char, idx) => {
                    const isUsed = this.wordState.disabledTileIdxs.includes(idx);
                    const t = document.createElement("div");
                    t.className = `hex-tile ${isUsed ? "disabled" : ""}`;
                    t.innerText = char;
                    t.onclick = () => { if (!isUsed) this.typeHexLetter(char, idx); };
                    hex.appendChild(t);
                  });
                },
                typeHexLetter(char, tileIdx) {
                  if (this.wordState.entered.length >= this.wordState.answer.length) return;
                  SoundEngine.playTone(600, 'sine', 0.06);
                  triggerHaptic(30);
                  this.wordState.entered.push({ char, tileIdx });
                  this.wordState.disabledTileIdxs.push(tileIdx);
                  this.renderWordUI();
                  if (this.wordState.entered.length === this.wordState.answer.length) {
                    const formed = this.wordState.entered.map(e => e.char).join("");
                    if (formed === this.wordState.answer) this.handleModeSuccess();
                    else {
                      SoundEngine.wrong();
                      triggerHaptic(120);
                      setTimeout(() => alert("الإجابة غير صحيحة، حاول مجدداً!"), 100);
                    }
                  }
                },
                removeWordLetterAt(index) {
                  SoundEngine.tap();
                  const removed = this.wordState.entered.splice(index, 1)[0];
                  if (removed) this.wordState.disabledTileIdxs = this.wordState.disabledTileIdxs.filter(i => i !== removed.tileIdx);
                  this.renderWordUI();
                },
                backspaceWord() {
                  if (this.wordState.entered.length === 0) return;
                  SoundEngine.tap();
                  const last = this.wordState.entered.pop();
                  if (last) this.wordState.disabledTileIdxs = this.wordState.disabledTileIdxs.filter(i => i !== last.tileIdx);
                  this.renderWordUI();
                },
                clearWord() {
                  SoundEngine.tap();
                  this.wordState.entered = [];
                  this.wordState.disabledTileIdxs = [];
                  this.renderWordUI();
                },
                setupMemoryMode(mode) {
                  document.getElementById("container-mode-memory").classList.remove("hidden");
                  const items = [...mode.pairs, ...mode.pairs].sort(() => Math.random() - 0.5);
                  this.memoryState = { items, flipped: [], matchedCount: 0, locked: false };
                  const grid = document.getElementById("memory-grid-container");
                  grid.innerHTML = "";
                  document.getElementById("memory-moves-counter").innerText = `المطابقات: 0 / ${mode.pairs.length}`;
                  items.forEach((icon, idx) => {
                    const card = document.createElement("div");
                    card.className = "mem-card";
                    card.innerHTML = `<div class="mem-inner"><div class="mem-back">❓</div><div class="mem-front">${icon}</div></div>`;
                    card.onclick = () => this.flipMemoryCard(card, idx, icon, mode.pairs.length);
                    grid.appendChild(card);
                  });
                },
                flipMemoryCard(cardEl, idx, icon, total) {
                  if (this.memoryState.locked || cardEl.classList.contains("flipped") || cardEl.classList.contains("matched")) return;
                  SoundEngine.tap();
                  triggerHaptic(25);
                  cardEl.classList.add("flipped");
                  this.memoryState.flipped.push({ cardEl, idx, icon });
                  if (this.memoryState.flipped.length === 2) {
                    this.memoryState.locked = true;
                    const [c1, c2] = this.memoryState.flipped;
                    if (c1.icon === c2.icon) {
                      SoundEngine.correct();
                      triggerHaptic(60);
                      setTimeout(() => {
                        c1.cardEl.classList.add("matched");
                        c2.cardEl.classList.add("matched");
                        this.memoryState.flipped = [];
                        this.memoryState.matchedCount++;
                        document.getElementById("memory-moves-counter").innerText = `المطابقات: ${this.memoryState.matchedCount} / ${total}`;
                        this.memoryState.locked = false;
                        if (this.memoryState.matchedCount === total) this.handleModeSuccess();
                      }, 300);
                    } else {
                      SoundEngine.wrong();
                      triggerHaptic(80);
                      setTimeout(() => {
                        c1.cardEl.classList.remove("flipped");
                        c2.cardEl.classList.remove("flipped");
                        this.memoryState.flipped = [];
                        this.memoryState.locked = false;
                      }, 750);
                    }
                  }
                },
                setupOptionsMode(mode) {
                  document.getElementById("container-mode-options").classList.remove("hidden");
                  const grid = document.getElementById("options-grid-container");
                  grid.innerHTML = "";
                  mode.options.forEach((optText, optIdx) => {
                    const btn = document.createElement("button");
                    btn.className = "option-btn";
                    btn.innerHTML = `<span>${optText}</span><span>⭘</span>`;
                    btn.onclick = () => {
                      if (btn.classList.contains("correct") || btn.classList.contains("wrong")) return;
                      if (optIdx === mode.answerIndex) {
                        btn.classList.add("correct");
                        this.handleModeSuccess();
                      } else {
                        SoundEngine.wrong();
                        triggerHaptic(100);
                        btn.classList.add("wrong");
                      }
                    };
                    grid.appendChild(btn);
                  });
                },
                setupObsMode(mode) {
                  document.getElementById("container-mode-obs").classList.remove("hidden");
                  const grid = document.getElementById("obs-grid-container");
                  grid.innerHTML = "";
                  mode.items.forEach((emoji, idx) => {
                    const item = document.createElement("div");
                    item.className = "obs-item";
                    item.innerText = emoji;
                    item.onclick = () => {
                      if (idx === mode.correctIndex) {
                        item.style.borderColor = "#00E676";
                        this.handleModeSuccess();
                      } else {
                        SoundEngine.wrong();
                        triggerHaptic(80);
                        item.style.borderColor = "#FF5252";
                      }
                    };
                    grid.appendChild(item);
                  });
                },
                handleModeSuccess() {
                  SoundEngine.correct();
                  triggerHaptic(80);
                  if (!this.progress[this.currentStageIndex]) {
                    this.progress[this.currentStageIndex] = { solvedModes: [], passed: false, stars: 0 };
                  }
                  const prog = this.progress[this.currentStageIndex];
                  if (!prog.solvedModes.includes(this.currentModeIndex)) {
                    prog.solvedModes.push(this.currentModeIndex);
                    this.coins += 25;
                  }
                  if (prog.solvedModes.length >= 5) {
                    prog.passed = true;
                    prog.stars = prog.solvedModes.length === 6 ? 3 : 2;
                  }
                  this.saveStorage();
                  this.updateHeaderUI();
                  setTimeout(() => {
                    if (prog.solvedModes.length === 5 && !prog.celebrated) {
                      prog.celebrated = true;
                      this.saveStorage();
                      this.openVictoryModal();
                    } else {
                      this.showStageHub(this.currentStageIndex);
                    }
                  }, 550);
                },
                openVictoryModal() {
                  SoundEngine.victory();
                  launchConfetti();
                  triggerHaptic(150);
                  const prog = this.progress[this.currentStageIndex];
                  document.getElementById("victory-stars-display").innerText = prog.stars === 3 ? "⭐⭐⭐" : "⭐⭐";
                  document.getElementById("victory-modal-desc").innerText = 
                    `رائع جداً! لقد نجحت في حل ${prog.solvedModes.length} من 6 طرق في هذه المرحلة وفتحت المرحلة التالية!`;
                  document.getElementById("modal-victory").classList.remove("hidden");
                },
                goToNextStageFromModal() {
                  this.closeModal("modal-victory");
                  if (this.currentStageIndex + 1 < GAME_STAGES.length) {
                    this.showStageHub(this.currentStageIndex + 1);
                  } else {
                    alert("مبروك! لقد أتممت جميع مراحل اللعبة بنجاح باهر!");
                    this.renderStagesMap();
                    this.showScreen("screen-map");
                  }
                },
                checkStagePassedOrNext() {
                  SoundEngine.tap();
                  const prog = this.progress[this.currentStageIndex] || { solvedModes: [] };
                  if (prog.solvedModes.length >= 5) this.openVictoryModal();
                  else alert(`يجب عليك إكمال 5 طرق على الأقل لاجتياز المرحلة. المتبقي: ${5 - prog.solvedModes.length} طرق.`);
                },
                useHint() {
                  if (this.coins < 25) { alert("عفواً! يلزم 25 عملة ذهبية لاستخدام المساعدة."); return; }
                  SoundEngine.tap();
                  this.coins -= 25;
                  this.updateHeaderUI();
                  this.saveStorage();
                  const mode = GAME_STAGES[this.currentStageIndex].modes[this.currentModeIndex];
                  if (mode.type === "word") {
                    const target = mode.answer;
                    const nextIdx = this.wordState.entered.length;
                    if (nextIdx < target.length) {
                      const nextChar = target[nextIdx];
                      const tileIdx = this.wordState.tiles.findIndex((c, i) => c === nextChar && !this.wordState.disabledTileIdxs.includes(i));
                      if (tileIdx !== -1) this.typeHexLetter(nextChar, tileIdx);
                    }
                  } else if (mode.type === "obs") {
                    alert("تلميح: الرمز المطلوب يوجد في منتصف أو قرب الصف الأخير من الشبكة!");
                  } else if (mode.options) {
                    const opts = document.querySelectorAll(".option-btn");
                    opts.forEach((btn, idx) => {
                      if (idx !== mode.answerIndex && !btn.classList.contains("wrong")) {
                        btn.style.opacity = "0.2";
                        btn.style.pointerEvents = "none";
                      }
                    });
                  }
                },
                openSettings() { SoundEngine.tap(); document.getElementById("modal-settings").classList.remove("hidden"); },
                openAboutUs() { SoundEngine.tap(); document.getElementById("modal-about").classList.remove("hidden"); },
                openRules() { SoundEngine.tap(); document.getElementById("modal-rules").classList.remove("hidden"); },
                closeModal(id) { SoundEngine.tap(); document.getElementById(id).classList.add("hidden"); },
                toggleSetting(key) {
                  SoundEngine.tap();
                  this.settings[key] = !this.settings[key];
                  if (key === 'sound') SoundEngine.enabled = this.settings.sound;
                  this.syncSettingsToggles();
                  this.saveStorage();
                },
                syncSettingsToggles() {
                  const s = document.getElementById("toggle-sound");
                  const v = document.getElementById("toggle-vibe");
                  if (this.settings.sound) s.classList.add("on"); else s.classList.remove("on");
                  if (this.settings.vibe) v.classList.add("on"); else v.classList.remove("on");
                },
                confirmResetProgress() {
                  SoundEngine.tap();
                  if (confirm("هل أنت متأكد من رغبتك في إعادة ضبط اللعبة والبدء من المرحلة الأولى؟")) {
                    this.progress = {};
                    this.coins = 300;
                    this.stars = 0;
                    this.saveStorage();
                    this.updateHeaderUI();
                    this.closeModal("modal-settings");
                    this.renderStagesMap();
                    this.showScreen("screen-map");
                  }
                }
              };

              window.addEventListener("DOMContentLoaded", () => Game.init());
            </script>
          </body>
          </html>
          EOF

      - name: Setup Gradle Wrapper
        run: |
          if command -v gradle &> /dev/null; then
            gradle wrapper --gradle-version 8.5
          else
            wget -q https://services.gradle.org/distributions/gradle-8.5-bin.zip -P /tmp
            unzip -q /tmp/gradle-8.5-bin.zip -d /tmp
            /tmp/gradle-8.5/bin/gradle wrapper
          fi
          chmod +x gradlew

      - name: Build Android Debug APK
        run: |
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Arabic-Puzzle-Game-APK
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
