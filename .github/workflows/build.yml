name: Build Android APK - لعبة الألغاز العربية

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: بناء تطبيق الألغاز أندرويد APK
    runs-on: ubuntu-latest

    steps:
      - name: فحص المستودع (Checkout)
        uses: actions/checkout@v4
        continue-on-error: true

      - name: إعداد بيئة جافا (Setup Java 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: تهيئة حزمة أندرويد وقبول الرخص (Setup Android SDK)
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          echo "sdk.dir=/usr/local/lib/android/sdk" > local.properties
          yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses 2>/dev/null || true

      - name: تثبيت نظام البناء Gradle
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.5-bin.zip
          unzip -q gradle-8.5-bin.zip
          echo "$PWD/gradle-8.5/bin" >> $GITHUB_PATH

      - name: توليد ملفات المشروع وتطبيق الألعاب
        run: |
          mkdir -p app/src/main/java/com/ammar/puzzle
          mkdir -p app/src/main/assets
          mkdir -p app/src/main/res/mipmap-hdpi
          mkdir -p app/src/main/res/values

          # 1. settings.gradle
          cat << 'ENDSETTINGS' > settings.gradle
          rootProject.name = "AmmarPuzzleGame"
          include ':app'
          ENDSETTINGS

          # 2. build.gradle (Root)
          cat << 'ENDBUILD' > build.gradle
          buildscript {
              repositories {
                  google()
                  mavenCentral()
              }
              dependencies {
                  classpath 'com.android.tools.build:gradle:8.2.2'
              }
          }
          allprojects {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          ENDBUILD

          # 3. app/build.gradle
          cat << 'ENDAPPBUILD' > app/build.gradle
          plugins {
              id 'com.android.application'
          }
          android {
              namespace 'com.ammar.puzzle'
              compileSdk 34
              defaultConfig {
                  applicationId "com.ammar.puzzle"
                  minSdk 21
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }
              buildTypes {
                  release {
                      minifyEnabled false
                      signingConfig signingConfigs.debug
                  }
                  debug {
                      debuggable true
                  }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          ENDAPPBUILD

          # 4. AndroidManifest.xml
          cat << 'ENDMANIFEST' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              package="com.ammar.puzzle">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.VIBRATE" />
              <application
                  android:allowBackup="true"
                  android:icon="@mipmap/ic_launcher"
                  android:label="لعبة الألغاز"
                  android:roundIcon="@mipmap/ic_launcher"
                  android:supportsRtl="true"
                  android:hardwareAccelerated="true"
                  android:theme="@android:style/Theme.NoTitleBar.Fullscreen">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:configChanges="orientation|screenSize|keyboardHidden"
                      android:screenOrientation="portrait">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          ENDMANIFEST

          # 5. MainActivity.java
          cat << 'ENDJAVA' > app/src/main/java/com/ammar/puzzle/MainActivity.java
          package com.ammar.puzzle;

          import android.app.Activity;
          import android.os.Bundle;
          import android.os.Build;
          import android.os.Vibrator;
          import android.os.VibrationEffect;
          import android.content.Context;
          import android.view.Window;
          import android.view.WindowManager;
          import android.webkit.JavascriptInterface;
          import android.webkit.WebChromeClient;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;

          public class MainActivity extends Activity {
              private WebView webView;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  requestWindowFeature(Window.FEATURE_NO_TITLE);
                  getWindow().setFlags(WindowManager.LayoutParams.FLAG_FULLSCREEN,
                          WindowManager.LayoutParams.FLAG_FULLSCREEN);

                  webView = new WebView(this);
                  setContentView(webView);

                  WebSettings settings = webView.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setDatabaseEnabled(true);
                  settings.setAllowFileAccess(true);
                  settings.setAllowContentAccess(true);
                  settings.setMediaPlaybackRequiresUserGesture(false);

                  // Native Android Bridge for Haptic Feedback
                  webView.addJavascriptInterface(new WebAppInterface(this), "AndroidBridge");

                  webView.setWebViewClient(new WebViewClient());
                  webView.setWebChromeClient(new WebChromeClient());

                  webView.loadUrl("file:///android_asset/index.html");
              }

              public class WebAppInterface {
                  Context mContext;
                  WebAppInterface(Context c) { mContext = c; }

                  @JavascriptInterface
                  public void vibrate(int milliseconds) {
                      try {
                          Vibrator v = (Vibrator) mContext.getSystemService(Context.VIBRATOR_SERVICE);
                          if (v != null && v.hasVibrator()) {
                              if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                                  v.vibrate(VibrationEffect.createOneShot(milliseconds, VibrationEffect.DEFAULT_AMPLITUDE));
                              } else {
                                  v.vibrate(milliseconds);
                              }
                          }
                      } catch (Exception ignored) {}
                  }
              }

              @Override
              public void onBackPressed() {
                  if (webView.canGoBack()) {
                      webView.goBack();
                  } else {
                      super.onBackPressed();
                  }
              }
          }
          ENDJAVA

          # 6. strings.xml
          cat << 'ENDSTRINGS' > app/src/main/res/values/strings.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">لعبة الألغاز العربية</string>
          </resources>
          ENDSTRINGS

          # 7. أيقونة التطبيق الذهبية
          python3 -c "
          import zlib, struct
          def make_png(w, h, c):
              raw = bytearray()
              for y in range(h):
                  raw.append(0)
                  for x in range(w):
                      d = ((x-w/2)**2 + (y-h/2)**2)**0.5
                      raw.extend([255, 183, 3] if d < w*0.45 else c)
              comp = zlib.compress(raw)
              def chunk(tag, data):
                  return struct.pack('>I', len(data)) + tag + data + struct.pack('>I', zlib.crc32(tag+data)&0xffffffff)
              return b'\x89PNG\r\n\x1a\n' + chunk(b'IHDR', struct.pack('>IIBBBBB', w, h, 8, 2, 0, 0, 0)) + chunk(b'IDAT', comp) + chunk(b'IEND', b'')
          with open('app/src/main/res/mipmap-hdpi/ic_launcher.png', 'wb') as f:
              f.write(make_png(72, 72, (251, 133, 0)))
          "

