              const AudioEngine = {
                ctx: null,
                init() {
                  if (!this.ctx) {
                    const AudioContext = window.AudioContext || window.webkitAudioContext;
                    if (AudioContext) this.ctx = new AudioContext();
                  }
                },
                playTone(freq, type = 'sine', duration = 0.1, delay = 0) {
                  if (!GameState.settings.sound) return;
                  try {
                    this.init();
                    if (!this.ctx) return;
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = type;
                    osc.frequency.setValueAtTime(freq, this.ctx.currentTime + delay);
                    gain.gain.setValueAtTime(0.2, this.ctx.currentTime + delay);
                    gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + delay + duration);
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start(this.ctx.currentTime + delay);
                    osc.stop(this.ctx.currentTime + delay + duration);
                  } catch (e) {}
                },
                click() { this.playTone(600, 'triangle', 0.05); },
                correct() {
                  this.playTone(523.25, 'sine', 0.1, 0);
                  this.playTone(659.25, 'sine', 0.1, 0.08);
                  this.playTone(783.99, 'sine', 0.2, 0.16);
                  this.playTone(1046.50, 'sine', 0.35, 0.24);
                },
                wrong() {
                  this.playTone(250, 'sawtooth', 0.15, 0);
                  this.playTone(180, 'sawtooth', 0.25, 0.12);
                },
                victory() {
                  [523, 659, 783, 1046, 1318].forEach((f, i) => {
