            <script>
              const SoundEngine = {
                ctx: null,
                enabled: true,
                init() {
                  if (!this.ctx) {
                    const AudioContext = window.AudioContext || window.webkitAudioContext;
                    if (AudioContext) this.ctx = new AudioContext();
                  }
                },
                playTone(freq, type, duration, delay = 0) {
                  if (!this.enabled) return;
                  this.init();
                  if (!this.ctx) return;
                  setTimeout(() => {
                    try {
                      const osc = this.ctx.createOscillator();
                      const gain = this.ctx.createGain();
                      osc.type = type;
                      osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
                      gain.gain.setValueAtTime(0.2, this.ctx.currentTime);
                      gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + duration);
                      osc.connect(gain);
                      gain.connect(this.ctx.destination);
                      osc.start();
                      osc.stop(this.ctx.currentTime + duration);
                    } catch(e) {}
                  }, delay);
                },
                tap() { this.playTone(550, 'sine', 0.08); },
                correct() {
                  this.playTone(523.25, 'triangle', 0.15, 0);
                  this.playTone(659.25, 'triangle', 0.15, 120);
                  this.playTone(783.99, 'triangle', 0.18, 240);
                  this.playTone(1046.50, 'triangle', 0.25, 360);
                },
                wrong() {
                  this.playTone(180, 'sawtooth', 0.15, 0);
                  this.playTone(140, 'sawtooth', 0.2, 120);
                },
                victory() {
                  const notes = [440, 554, 659, 880, 783, 880];
                  notes.forEach((n, i) => this.playTone(n, 'triangle', 0.2, i * 140));
                }
              };

              function triggerHaptic(ms = 40) {
                if (!Game.settings.vibe) return;
                if (window.AndroidNative && window.AndroidNative.vibrate) {
                  window.AndroidNative.vibrate(ms);
                } else if (navigator.vibrate) {
                  navigator.vibrate(ms);
                }
              }

              function launchConfetti() {
                const canvas = document.getElementById('confetti-canvas');
                const ctx = canvas.getContext('2d');
                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;
                const pieces = [];
                const colors = ['#FFD700', '#FF5722', '#00E676', '#00D2FF', '#FFFFFF'];
                for (let i = 0; i < 70; i++) {
                  pieces.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height - canvas.height,
                    size: Math.random() * 8 + 6,
                    color: colors[Math.floor(Math.random() * colors.length)],
                    vx: Math.random() * 4 - 2,
                    vy: Math.random() * 4 + 3,
                    rot: Math.random() * 360,
                    vrot: Math.random() * 8 - 4
                  });
                }
                let frame = 0;
                function render() {
                  ctx.clearRect(0, 0, canvas.width, canvas.height);
                  pieces.forEach(p => {
                    p.x += p.vx; p.y += p.vy; p.rot += p.vrot;
                    ctx.save();
                    ctx.translate(p.x, p.y);
                    ctx.rotate((p.rot * Math.PI) / 180);
                    ctx.fillStyle = p.color;
                    ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size);
                    ctx.restore();
                  });
                  frame++;
                  if (frame < 120) requestAnimationFrame(render);
                  else ctx.clearRect(0, 0, canvas.width, canvas.height);
                }
                render();
              }

