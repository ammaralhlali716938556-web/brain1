              const GameState = {
                coins: 150,
                solved: {},
                currentStageId: 1,
                currentPuzzle: null,
                speedTimerInterval: null,
                memoryState: { deck: [], revealed: [], matchedIds: [], lock: false },
                scrambleState: { entered: [], target: '', letters: [] },
                lastDailyRewardTime: 0,
                settings: {
                  sound: true,
                  vibration: true,
                  theme: 'dark',
                  fontSize: 'normal'
                },

                load() {
                  try {
                    const raw = localStorage.getItem('ammar_alghaz_save');
                    if (raw) {
                      const data = JSON.parse(raw);
                      if (data.coins !== undefined) this.coins = data.coins;
                      if (data.solved) this.solved = data.solved;
                      if (data.lastDailyRewardTime) this.lastDailyRewardTime = data.lastDailyRewardTime;
                      if (data.settings) this.settings = Object.assign(this.settings, data.settings);
                    }
                  } catch(e) {}
                },

                save() {
                  try {
                    localStorage.setItem('ammar_alghaz_save', JSON.stringify({
                      coins: this.coins,
                      solved: this.solved,
                      lastDailyRewardTime: this.lastDailyRewardTime,
                      settings: this.settings
                    }));
                  } catch(e) {}
                  this.updateHeader();
                },

                updateHeader() {
                  document.getElementById('coinsAmount').textContent = this.coins;
                  const now = Date.now();
                  const giftBtn = document.getElementById('dailyRewardBtn');
                  if (now - this.lastDailyRewardTime > 24 * 3600 * 1000) {
                    giftBtn.classList.add('gift-ready');
                  } else {
                    giftBtn.classList.remove('gift-ready');
                  }
                },

                isPuzzleSolved(stageId, way) {
                  return !!this.solved[`${stageId}_${way}`];
                },

                getStageSolvedCount(stageId) {
                  let count = 0;
                  for (let w = 1; w <= 6; w++) {
                    if (this.isPuzzleSolved(stageId, w)) count++;
                  }
                  return count;
                },

                isStageUnlocked(stageId) {
                  if (stageId === 1) return true;
                  return this.getStageSolvedCount(stageId - 1) >= 5;
                },

                isStagePassed(stageId) {
                  return this.getStageSolvedCount(stageId) >= 5;
                },

                isStageMastered(stageId) {
                  return this.getStageSolvedCount(stageId) === 6;
                }
              };

              function renderStagesView() {
                const container = document.getElementById('appContainer');
                let html = `
                  <div class="view-title">اختر مرحلة التحدي</div>
                  <div class="view-subtitle">أجب على 5 طرق على الأقل في كل مرحلة لفتح المرحلة التالية 🎯</div>
                  <div class="stages-grid">
                `;

                STAGES_DATA.forEach(stage => {
                  const unlocked = GameState.isStageUnlocked(stage.id);
                  const solvedCount = GameState.getStageSolvedCount(stage.id);
                  const passed = GameState.isStagePassed(stage.id);
                  const mastered = GameState.isStageMastered(stage.id);

                  let cardClass = 'stage-card';
                  let badgeText = '';

                  if (!unlocked) {
                    cardClass += ' locked';
                    badgeText = '🔒 مغلقة (أكمل 5 من المرحلة السابقة)';
                  } else if (mastered) {
                    cardClass += ' mastered';
                    badgeText = '👑 إتقان تام (6/6 علامة كاملة)';
                  } else if (passed) {
                    cardClass += ' passed';
                    badgeText = '⭐ تم الاجتياز بنجاح (المرحلة التالية مفتوحة)';
                  } else {
                    cardClass += ' unlocked';
                    badgeText = `🔓 قيد التحدي (${solvedCount} من 6 طرق)`;
                  }

                  const percent = Math.round((solvedCount / 6) * 100);

                  html += `
                    <div class="${cardClass}" onclick="openStageDetail(${stage.id})">
                      <div class="stage-icon">${stage.icon}</div>
                      <div class="stage-info">
                        <div class="stage-title">${stage.title}</div>
                        <div class="stage-desc">${stage.description}</div>
                        <div class="stage-progress-bar">
                          <div class="stage-progress-fill" style="width: ${percent}%;"></div>
                        </div>
                        <div class="stage-status-text">
                          <span>${badgeText}</span>
                          <span>${solvedCount}/6</span>
                        </div>
                      </div>
                    </div>
                  `;
                });

                html += `</div>`;
                container.innerHTML = html;
              }

              function openStageDetail(stageId) {
                if (!GameState.isStageUnlocked(stageId)) {
                  AudioEngine.wrong();
                  triggerVibrate(60);
                  alert('هذه المرحلة مغلقة حالياً!\nيجب حل 5 طرق على الأقل في المرحلة السابقة لفتحها.');
                  return;
                }
                AudioEngine.click();
                triggerVibrate(20);
                GameState.currentStageId = stageId;
                renderStageDetailView(stageId);
              }

              function renderStageDetailView(stageId) {
                const stage = STAGES_DATA.find(s => s.id === stageId);
                if (!stage) return;

                const solvedCount = GameState.getStageSolvedCount(stageId);
                const passed = GameState.isStagePassed(stageId);
                const mastered = GameState.isStageMastered(stageId);
                const percent = Math.round((solvedCount / 6) * 100);

                const container = document.getElementById('appContainer');
                let html = `
                  <div class="stage-header-box">
                    <button class="back-btn" onclick="renderStagesView()">
                      <span>➔</span>
                      <span>العودة لقائمة المراحل</span>
                    </button>
                    <div style="display:flex; align-items:center; gap:8px; margin-top:4px;">
                      <span style="font-size:1.8rem;">${stage.icon}</span>
                      <div>
                        <h2 style="font-size:1.2rem; font-weight:800;">${stage.title}</h2>
                        <p style="font-size:0.85rem; color:var(--text-muted);">${stage.description}</p>
                      </div>
                    </div>
                    
                    <div style="margin-top:12px;">
                      <div class="stage-progress-bar" style="height:8px;">
                        <div class="stage-progress-fill" style="width: ${percent}%;"></div>
                      </div>
                      <div style="display:flex; justify-content:space-between; font-size:0.82rem; margin-top:4px; font-weight:700;">
                        <span>أنجزت ${solvedCount} من 6 طرق</span>
                        <span>${mastered ? '👑 علامة كاملة!' : passed ? '⭐ تم اجتياز المرحلة' : 'متبقي ' + (5 - solvedCount) + ' لفتح التالية'}</span>
                      </div>
                    </div>

                    <div class="rule-badge">
                      ${passed ? '🎉 أحسنت! تجاوزت شرط الـ 5 طرق وفُتحت المرحلة التالية' : '📌 شرط النجاح: حل 5 طرق على الأقل للتأهل'}
                    </div>
                  </div>

                  <div class="puzzles-grid">
                `;

                stage.puzzles.forEach(puzzle => {
                  const isSolved = GameState.isPuzzleSolved(stageId, puzzle.way);
                  html += `
                    <div class="puzzle-card ${isSolved ? 'solved' : ''}" onclick="openPuzzle(${stageId}, ${puzzle.way})">
                      <div>
                        <div class="puzzle-way-num">الطريقة ${puzzle.way}</div>
                        <div class="puzzle-card-title">${puzzle.title}</div>
                        <div class="puzzle-card-cat">${puzzle.category}</div>
                      </div>
                      <div class="puzzle-card-status">
                        ${isSolved ? '<span>✅ تم الحل (+20)</span>' : '<span>⏳ ابدأ التحدي</span>'}
                      </div>
                    </div>
                  `;
                });

                html += `</div>`;
                container.innerHTML = html;
              }

              function openPuzzle(stageId, way) {
                AudioEngine.click();
                triggerVibrate(25);
                const stage = STAGES_DATA.find(s => s.id === stageId);
                const puzzle = stage.puzzles.find(p => p.way === way);
                GameState.currentPuzzle = { stageId, puzzle };

                document.getElementById('puzzleModalName').textContent = `${stage.title} • الطريقة ${puzzle.way}: ${puzzle.title}`;
                const playArea = document.getElementById('puzzlePlayArea');
                const feedback = document.getElementById('feedbackBox');
                feedback.style.display = 'none';
                feedback.className = 'feedback-box';

                const isSolved = GameState.isPuzzleSolved(stageId, way);
                document.getElementById('puzzlePointsTag').textContent = isSolved ? '✅ اللغز محلول مسبقاً' : '+20 نقطة عند الحل';

                if (puzzle.type === 'trivia' || puzzle.type === 'riddle') {
                  renderTriviaOrRiddle(puzzle, playArea);
                } else if (puzzle.type === 'scramble') {
                  renderScramble(puzzle, playArea);
                } else if (puzzle.type === 'speed_tf') {
                  renderSpeedTF(puzzle, playArea);
                } else if (puzzle.type === 'connection') {
                  renderConnection(puzzle, playArea);
                } else if (puzzle.type === 'memory_match') {
                  renderMemoryMatch(puzzle, playArea);
                }

                document.getElementById('puzzleModal').classList.add('active');
              }

              function closePuzzle() {
                if (GameState.speedTimerInterval) {
                  clearInterval(GameState.speedTimerInterval);
                  GameState.speedTimerInterval = null;
                }
                document.getElementById('puzzleModal').classList.remove('active');
                renderStageDetailView(GameState.currentStageId);
              }

              function awardPuzzleSolved(puzzleObj) {
                const { stageId, puzzle } = puzzleObj;
                const key = `${stageId}_${puzzle.way}`;
                if (!GameState.solved[key]) {
                  GameState.solved[key] = true;
                  GameState.coins += 20;

                  const solvedCount = GameState.getStageSolvedCount(stageId);
                  if (solvedCount === 5) {
                    GameState.coins += 30;
                    setTimeout(() => {
                      AudioEngine.victory();
                      alert('🎉 تهانينا البالغة!\nلقد حللت 5 طرق بنجاح وتم فتح المرحلة التالية! 🚀\nحصلت على +30 نقطة إضافية مكافأة تأهل!');
                    }, 600);
                  } else if (solvedCount === 6) {
                    GameState.coins += 50;
                    setTimeout(() => {
                      AudioEngine.victory();
                      alert('👑 إنجاز أسطوري وعلامة كاملة!\nلقد حللت جميع الطرق الست في هذه المرحلة ببراعة فائقة!\nحصلت على +50 نقطة إضافية ووسام الإتقان! 🌟');
                    }, 600);
                  }

                  GameState.save();
                }
              }

              function renderTriviaOrRiddle(puzzle, container) {
                let html = `<div class="puzzle-question-text">${puzzle.question}</div><div class="options-list">`;
                puzzle.options.forEach((opt, idx) => {
                  html += `<button class="option-btn" id="opt_${idx}" onclick="checkOption(${idx})">${opt}</button>`;
                });
                html += `</div>`;
                container.innerHTML = html;
              }

              window.checkOption = function(idx) {
                const { puzzle } = GameState.currentPuzzle;
                const feedback = document.getElementById('feedbackBox');
                const isCorrect = (idx === puzzle.correct);
                const btn = document.getElementById(`opt_${idx}`);

                if (isCorrect) {
                  AudioEngine.correct();
                  triggerVibrate(50);
                  btn.classList.add('correct');
                  feedback.className = 'feedback-box correct';
                  feedback.innerHTML = `<strong>إجابة صحيحة وممتازة! 🎉</strong><br>${puzzle.explanation || ''}`;
                  document.querySelectorAll('.option-btn').forEach(b => b.disabled = true);
                  awardPuzzleSolved(GameState.currentPuzzle);
                } else {
                  AudioEngine.wrong();
                  triggerVibrate(80);
                  btn.classList.add('wrong');
                  feedback.className = 'feedback-box wrong';
                  feedback.innerHTML = `<strong>إجابة غير دقيقة! حاول مجدداً أو استعن بالتلميح 💡</strong>`;
                }
              };

              function renderScramble(puzzle, container) {
                GameState.scrambleState = {
                  entered: [],
                  target: puzzle.answer,
                  letters: [...puzzle.letters].sort(() => Math.random() - 0.5)
                };

                let html = `
                  <div class="puzzle-question-text">${puzzle.question}</div>
                  <div class="scramble-slots" id="scrambleSlots"></div>
                  <div class="scramble-keyboard" id="scrambleLetters"></div>
                  <div class="scramble-controls">
                    <button class="action-sub-btn" onclick="backspaceScramble()">⌫ حذف حرف</button>
                    <button class="action-sub-btn" onclick="clearScramble()">مسح الكل</button>
                  </div>
                `;
                container.innerHTML = html;
                updateScrambleUI();
              }

              function updateScrambleUI() {
                const { entered, target, letters } = GameState.scrambleState;
                const slotsContainer = document.getElementById('scrambleSlots');
                const keysContainer = document.getElementById('scrambleLetters');
                if (!slotsContainer || !keysContainer) return;

                let slotsHtml = '';
                for (let i = 0; i < target.length; i++) {
                  const char = entered[i] || '';
                  slotsHtml += `<div class="scramble-slot ${char ? 'filled' : ''}">${char}</div>`;
                }
                slotsContainer.innerHTML = slotsHtml;

                let keysHtml = '';
                letters.forEach((ch, idx) => {
                  let prevCount = 0;
                  for (let j = 0; j < idx; j++) {
                    if (letters[j] === ch) prevCount++;
                  }
                  const usedCount = entered.filter(c => c === ch).length;
                  const isUsed = prevCount < usedCount;
                  keysHtml += `<button class="letter-btn ${isUsed ? 'used' : ''}" onclick="pickScrambleLetter('${ch}')">${ch}</button>`;
                });
                keysContainer.innerHTML = keysHtml;

                if (entered.length === target.length) {
                  const result = entered.join('');
                  const feedback = document.getElementById('feedbackBox');
                  if (result === target) {
                    AudioEngine.correct();
                    triggerVibrate(60);
                    feedback.className = 'feedback-box correct';
                    feedback.innerHTML = `<strong>إجابة رائعة وصحيحة! فككت الشفرة بنجاح 🎯</strong><br>${GameState.currentPuzzle.puzzle.explanation || ''}`;
                    awardPuzzleSolved(GameState.currentPuzzle);
                  } else {
                    AudioEngine.wrong();
                    triggerVibrate(70);
                    feedback.className = 'feedback-box wrong';
                    feedback.innerHTML = `<strong>الترتيب غير صحيح! حاول إعادة تنظيم الحروف.</strong>`;
                  }
                }
              }

              window.pickScrambleLetter = function(ch) {
                if (GameState.scrambleState.entered.length < GameState.scrambleState.target.length) {
                  AudioEngine.click();
                  triggerVibrate(15);
                  GameState.scrambleState.entered.push(ch);
                  updateScrambleUI();
                }
              };

              window.backspaceScramble = function() {
                if (GameState.scrambleState.entered.length > 0) {
                  AudioEngine.click();
                  GameState.scrambleState.entered.pop();
                  updateScrambleUI();
                }
              };

              window.clearScramble = function() {
                AudioEngine.click();
                GameState.scrambleState.entered = [];
                updateScrambleUI();
              };

              function renderSpeedTF(puzzle, container) {
                let secondsLeft = puzzle.timeLimit || 15;
                let html = `
                  <div class="timer-container">
                    <div class="timer-fill" id="speedTimerFill"></div>
                  </div>
                  <div class="puzzle-question-text" style="font-size:1.1rem;">${puzzle.question}</div>
                  <div class="tf-buttons-row">
                    <button class="tf-btn tf-true" onclick="checkTF(true)">✓ صح</button>
                    <button class="tf-btn tf-false" onclick="checkTF(false)">✗ خطأ</button>
                  </div>
                `;
                container.innerHTML = html;

                const fill = document.getElementById('speedTimerFill');
                fill.style.width = '100%';

                if (GameState.speedTimerInterval) clearInterval(GameState.speedTimerInterval);

                const startTime = Date.now();
                const totalMs = secondsLeft * 1000;

                GameState.speedTimerInterval = setInterval(() => {
                  const elapsed = Date.now() - startTime;
                  const remaining = Math.max(0, totalMs - elapsed);
                  const pct = (remaining / totalMs) * 100;
                  if (fill) fill.style.width = `${pct}%`;

                  if (remaining <= 0) {
                    clearInterval(GameState.speedTimerInterval);
                    GameState.speedTimerInterval = null;
                    AudioEngine.wrong();
                    triggerVibrate(90);
                    const feedback = document.getElementById('feedbackBox');
                    feedback.className = 'feedback-box wrong';
                    feedback.innerHTML = `<strong>انتهى الوقت المحدد! ⏱️</strong><br><button class="btn-block" style="margin-top:8px;" onclick="openPuzzle(${GameState.currentPuzzle.stageId}, ${GameState.currentPuzzle.puzzle.way})">إعادة المحاولة</button>`;
                    document.querySelectorAll('.tf-btn').forEach(b => b.disabled = true);
                  }
                }, 100);
              }

              window.checkTF = function(answer) {
                if (GameState.speedTimerInterval) {
                  clearInterval(GameState.speedTimerInterval);
                  GameState.speedTimerInterval = null;
                }
                const { puzzle } = GameState.currentPuzzle;
                const feedback = document.getElementById('feedbackBox');
                document.querySelectorAll('.tf-btn').forEach(b => b.disabled = true);

                if (answer === puzzle.correct) {
                  AudioEngine.correct();
                  triggerVibrate(50);
                  feedback.className = 'feedback-box correct';
                  feedback.innerHTML = `<strong>سرعة بديهة مذهلة! إجابة صحيحة ⚡</strong><br>${puzzle.explanation || ''}`;
                  awardPuzzleSolved(GameState.currentPuzzle);
                } else {
                  AudioEngine.wrong();
                  triggerVibrate(80);
                  feedback.className = 'feedback-box wrong';
                  feedback.innerHTML = `<strong>إجابة خاطئة!</strong><br>${puzzle.explanation || ''}<br><button class="btn-block" style="margin-top:8px;" onclick="openPuzzle(${GameState.currentPuzzle.stageId}, ${GameState.currentPuzzle.puzzle.way})">أعد المحاولة</button>`;
                }
              };

              function renderConnection(puzzle, container) {
                let html = `
                  <div style="font-size:0.9rem; color:var(--text-muted); text-align:center; margin-bottom:8px;">أوجد السر المشترك بين هذه الكلمات الأربع:</div>
                  <div class="connection-words-grid">
                `;
                puzzle.words.forEach(w => {
                  html += `<div class="connection-word-box">${w}</div>`;
                });
                html += `</div>
                  <div class="puzzle-question-text" style="font-size:1.05rem;">${puzzle.question}</div>
                  <div class="options-list">
                `;
                puzzle.options.forEach((opt, idx) => {
                  html += `<button class="option-btn" id="opt_${idx}" onclick="checkOption(${idx})">${opt}</button>`;
                });
                html += `</div>`;
                container.innerHTML = html;
              }

              function renderMemoryMatch(puzzle, container) {
                let deck = [];
                puzzle.pairs.forEach(p => {
                  deck.push({ id: p.id, text: p.text });
                  deck.push({ id: p.id, text: p.pair });
                });
                deck.sort(() => Math.random() - 0.5);

                GameState.memoryState = {
                  deck: deck,
                  revealed: [],
                  matchedIds: [],
                  lock: false
                };

                let html = `
                  <div class="puzzle-question-text" style="font-size:1rem; margin-bottom:12px;">${puzzle.question}</div>
                  <div class="memory-grid" id="memoryGrid"></div>
                `;
                container.innerHTML = html;
                updateMemoryGridUI();
              }

              function updateMemoryGridUI() {
                const grid = document.getElementById('memoryGrid');
                if (!grid) return;
                const { deck, revealed, matchedIds } = GameState.memoryState;

                let html = '';
                deck.forEach((card, idx) => {
                  const isMatched = matchedIds.includes(card.id);
                  const isRevealed = isMatched || revealed.includes(idx);
                  html += `
                    <div class="memory-tile ${isMatched ? 'matched' : isRevealed ? 'revealed' : ''}" onclick="pickMemoryCard(${idx})">
                      ${isRevealed ? card.text : '❓'}
                    </div>
                  `;
                });
                grid.innerHTML = html;
              }

              window.pickMemoryCard = function(idx) {
                const st = GameState.memoryState;
                if (st.lock) return;
                if (st.revealed.includes(idx)) return;
                if (st.matchedIds.includes(st.deck[idx].id)) return;

                AudioEngine.click();
                triggerVibrate(20);
                st.revealed.push(idx);
                updateMemoryGridUI();

                if (st.revealed.length === 2) {
                  st.lock = true;
                  const [i1, i2] = st.revealed;
                  const c1 = st.deck[i1];
                  const c2 = st.deck[i2];

                  if (c1.id === c2.id) {
                    setTimeout(() => {
                      AudioEngine.correct();
                      triggerVibrate(40);
                      st.matchedIds.push(c1.id);
                      st.revealed = [];
                      st.lock = false;
                      updateMemoryGridUI();

                      if (st.matchedIds.length === 3) {
                        const feedback = document.getElementById('feedbackBox');
                        feedback.className = 'feedback-box correct';
                        feedback.innerHTML = `<strong>مطابقة عبقرية ومثالية! أتممت اللغز بنجاح 🌟</strong>`;
                        awardPuzzleSolved(GameState.currentPuzzle);
                      }
                    }, 350);
                  } else {
                    setTimeout(() => {
                      AudioEngine.wrong();
                      st.revealed = [];
                      st.lock = false;
                      updateMemoryGridUI();
                    }, 900);
                  }
                }
              };

              function openHintsModal() {
                AudioEngine.hint();
                triggerVibrate(20);
                const list = document.getElementById('hintOptionsList');
                const { puzzle } = GameState.currentPuzzle;

                let hints = [];

                if (puzzle.type === 'trivia' || puzzle.type === 'connection' || puzzle.type === 'riddle') {
                  hints.push({
                    title: 'حذف خيارين غير صحيحين (50:50)',
                    cost: 15,
                    action: () => {
                      if (deductCoins(15)) {
                        let hidden = 0;
                        puzzle.options.forEach((_, idx) => {
                          if (idx !== puzzle.correct && hidden < 2) {
                            const b = document.getElementById(`opt_${idx}`);
                            if (b && !b.classList.contains('hidden')) {
                              b.classList.add('hidden');
                              hidden++;
                            }
                          }
                        });
                        closeHintsModal();
                      }
                    }
                  });
                }

                if (puzzle.type === 'scramble') {
                  hints.push({
                    title: 'كشف الحرف التالي الصحيح',
                    cost: 10,
                    action: () => {
                      if (deductCoins(10)) {
                        const currentLen = GameState.scrambleState.entered.length;
                        if (currentLen < GameState.scrambleState.target.length) {
                          const nextChar = GameState.scrambleState.target[currentLen];
                          GameState.scrambleState.entered.push(nextChar);
                          updateScrambleUI();
                        }
                        closeHintsModal();
                      }
                    }
                  });
                }

                if (puzzle.hint) {
                  hints.push({
                    title: 'إظهار تلميح دلالي ذكي',
                    cost: 10,
                    action: () => {
                      if (deductCoins(10)) {
                        alert(`💡 تلميح خاص:\n${puzzle.hint}`);
                        closeHintsModal();
                      }
                    }
                  });
                }

                hints.push({
                  title: 'حل اللغز وتخطيه مباشرة',
                  cost: 35,
                  action: () => {
                    if (deductCoins(35)) {
                      awardPuzzleSolved(GameState.currentPuzzle);
                      const feedback = document.getElementById('feedbackBox');
                      feedback.className = 'feedback-box correct';
                      feedback.innerHTML = `<strong>تم تخطي اللغز بنجاح بالاستعانة بالمساعدات! 🎉</strong>`;
                      closeHintsModal();
                    }
                  }
                });

                let html = '';
                hints.forEach((h, i) => {
                  html += `
                    <button class="btn-block" style="text-align:right; display:flex; justify-content:space-between; align-items:center;" onclick="window.currentHintActions[${i}]()">
                      <span>${h.title}</span>
                      <span style="background:rgba(245,158,11,0.25); color:var(--accent-gold); padding:2px 8px; border-radius:6px;">🪙 ${h.cost}</span>
                    </button>
                  `;
                });

                window.currentHintActions = hints.map(h => h.action);
                list.innerHTML = html;
                document.getElementById('hintModal').classList.add('active');
              }

              function closeHintsModal() {
                document.getElementById('hintModal').classList.remove('active');
              }

              function deductCoins(amount) {
                if (GameState.coins >= amount) {
                  GameState.coins -= amount;
                  GameState.save();
                  AudioEngine.click();
                  triggerVibrate(25);
                  return true;
                } else {
                  AudioEngine.wrong();
                  triggerVibrate(70);
                  alert(`عذراً، رصيدك من النقاط لا يكفي!\nتحتاج ${amount} نقطة، ورصيدك الحالي ${GameState.coins} نقطة.\nيمكنك حصد النقاط بحل مراحل أخرى أو استلام الهدية اليومية 🎁`);
                  return false;
                }
              }

              function claimDailyReward() {
                const now = Date.now();
                const elapsed = now - GameState.lastDailyRewardTime;
                const cooldown = 24 * 3600 * 1000;

                if (elapsed >= cooldown) {
                  GameState.coins += 50;
                  GameState.lastDailyRewardTime = now;
                  GameState.save();
                  AudioEngine.victory();
                  triggerVibrate(80);
                  alert('🎁 تهانينا!\nحصلت على المكافأة اليومية المجانية وقدرها +50 نقطة ذهبية! 🌟');
                } else {
                  const remainingHours = Math.ceil((cooldown - elapsed) / (3600 * 1000));
                  AudioEngine.click();
                  alert(`لقد استلمت مكافأتك اليومية بالفعل!\nالمكافأة القادمة ستتاح بعد حوالي ${remainingHours} ساعة.`);
                }
              }

              function initEvents() {
                document.getElementById('closePuzzleBtn').onclick = closePuzzle;
                document.getElementById('openHintBtn').onclick = openHintsModal;
                document.getElementById('closeHintBtn').onclick = closeHintsModal;

                document.getElementById('settingsBtn').onclick = () => {
                  AudioEngine.click();
                  document.getElementById('settingsModal').classList.add('active');
                };
                document.getElementById('closeSettingsBtn').onclick = () => {
                  document.getElementById('settingsModal').classList.remove('active');
                };

                document.getElementById('aboutUsBtn').onclick = () => {
                  AudioEngine.click();
                  document.getElementById('aboutModal').classList.add('active');
                };
                document.getElementById('closeAboutBtn').onclick = () => {
                  document.getElementById('aboutModal').classList.remove('active');
                };

                document.getElementById('rulesBtn').onclick = () => {
                  AudioEngine.click();
                  document.getElementById('rulesModal').classList.add('active');
                };
                document.getElementById('closeRulesBtn').onclick = () => {
                  document.getElementById('rulesModal').classList.remove('active');
                };

                document.getElementById('dailyRewardBtn').onclick = claimDailyReward;

                const soundToggle = document.getElementById('soundToggle');
                const vibrateToggle = document.getElementById('vibrateToggle');
                const themeToggle = document.getElementById('themeToggle');
                const fontSizeSelect = document.getElementById('fontSizeSelect');

                soundToggle.checked = GameState.settings.sound;
                vibrateToggle.checked = GameState.settings.vibration;
                themeToggle.checked = (GameState.settings.theme === 'dark');
                fontSizeSelect.value = GameState.settings.fontSize;

                soundToggle.onchange = (e) => {
                  GameState.settings.sound = e.target.checked;
                  GameState.save();
                };
                vibrateToggle.onchange = (e) => {
                  GameState.settings.vibration = e.target.checked;
                  GameState.save();
                };
                themeToggle.onchange = (e) => {
                  GameState.settings.theme = e.target.checked ? 'dark' : 'light';
                  applyTheme();
                  GameState.save();
                };
                fontSizeSelect.onchange = (e) => {
                  GameState.settings.fontSize = e.target.value;
                  applyFontSize();
                  GameState.save();
                };

                document.getElementById('resetProgressBtn').onclick = () => {
                  if (confirm('هل أنت متأكد من رغبتك في إعادة ضبط اللعبة ومسح كل تقدمك ونقاطك بالكامل؟')) {
                    localStorage.removeItem('ammar_alghaz_save');
                    location.reload();
                  }
                };
              }

              function applyTheme() {
                if (GameState.settings.theme === 'light') {
                  document.body.classList.add('light-theme');
                } else {
                  document.body.classList.remove('light-theme');
                }
              }

              function applyFontSize() {
                document.body.classList.remove('font-large', 'font-xlarge');
                if (GameState.settings.fontSize === 'large') {
                  document.body.classList.add('font-large');
                } else if (GameState.settings.fontSize === 'xlarge') {
                  document.body.classList.add('font-xlarge');
                }
              }

              window.onload = () => {
                GameState.load();
                applyTheme();
                applyFontSize();
                GameState.updateHeader();
                initEvents();
                renderStagesView();
              };
            </script>
          </body>
          </html>
          ''')

          print("All Android project files created successfully!")
          PY_EOF

      - name: Download Gradle 8.4
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.4-bin.zip
          unzip -q gradle-8.4-bin.zip

      - name: Build Android Debug APK
        run: |
          ./gradle-8.4/bin/gradle assembleDebug --stacktrace

      - name: Upload APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Arabic-Puzzle-Game-Ammar-Alhilali
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        continue-on-error: true
        with:
          tag_name: v1.0.0
          name: "لعبة الألغاز العربية - إصدار 1.0.0"
          body: |
            ## 🎮 لعبة ألغاز وتحدي المعرفة (Android APK)
            **تصميم وبرمجة: عمار الهلالي**

            ### ✨ ميزات التطبيق:
            - **مراحل متعددة:** تبدأ بواحة الأذكياء وصولاً إلى قمة العباقرة.
            - **6 طرق متنوعة لكل مرحلة:**
              1. سؤال وتحدي (اختيار من متعدد)
              2. الحروف المبعثرة (فك الشفرة)
              3. حزورة وفزورة بليغة (أنا من أكون؟)
              4. سرعة البديهة (تحدي صح أو خطأ في 15 ثانية)
              5. الرابط المشترك (4 كلمات ورابط خفي واحد)
              6. مطابقة الذاكرة والمفاهيم (أزواج الكلمات)
            - **شرط النجاح:** الإجابة على 5 طرق على الأقل لفتح المرحلة التالية.
            - **نظام النقاط والمساعدات:** رصيد ذهبي، مكافأة يومية مجانية، ومساعدات ذكية.
            - **قائمة الإعدادات:** تضم زر "من نحن" (تصميم وبرمجة عمار الهلالي)، تحكم بالمؤثرات الصوتية والاهتزاز، والوضع الليلي، والخطوط.
          files: app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
