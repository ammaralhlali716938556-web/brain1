name: Build Android APK - لعبة الألغاز العربية

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: بناء تطبيق الألغاز أندرويد APK
    runs-on: ubuntu-latest

    steps:
      - name: فحص المستودع (Checkout)
        uses: actions/checkout@v4

      - name: إعداد بيئة جافا (Setup Java 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: تهيئة حزمة أندرويد وقبول الرخص
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          echo "sdk.dir=/usr/local/lib/android/sdk" > local.properties
          yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses 2>/dev/null || true

      - name: تثبيت نظام البناء Gradle
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.5-bin.zip
          unzip -q gradle-8.5-bin.zip
          echo "$PWD/gradle-8.5/bin" >> $GITHUB_PATH

      - name: توليد ملفات أندرويد الأصلية
        run: |
          mkdir -p app/src/main/java/com/ammar/puzzle
          mkdir -p app/src/main/assets
          mkdir -p app/src/main/res/mipmap-hdpi
          mkdir -p app/src/main/res/values

          # settings.gradle
          cat << 'EOF' > settings.gradle
          rootProject.name = "AmmarPuzzleGame"
          include ':app'
          EOF

          # build.gradle
          cat << 'EOF' > build.gradle
          buildscript {
              repositories { google(); mavenCentral() }
              dependencies { classpath 'com.android.tools.build:gradle:8.2.2' }
          }
          allprojects {
              repositories { google(); mavenCentral() }
          }
          EOF

          # app/build.gradle
          cat << 'EOF' > app/build.gradle
          plugins { id 'com.android.application' }
          android {
              namespace 'com.ammar.puzzle'
              compileSdk 34
              defaultConfig {
                  applicationId "com.ammar.puzzle"
                  minSdk 21
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }
              buildTypes {
                  release {
                      minifyEnabled false
                      signingConfig signingConfigs.debug
                  }
                  debug { debuggable true }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          EOF

          # AndroidManifest.xml
          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android" package="com.ammar.puzzle">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.VIBRATE" />
              <application
                  android:allowBackup="true"
                  android:icon="@mipmap/ic_launcher"
                  android:label="لعبة الألغاز العربية"
                  android:roundIcon="@mipmap/ic_launcher"
                  android:supportsRtl="true"
                  android:hardwareAccelerated="true"
                  android:theme="@android:style/Theme.NoTitleBar.Fullscreen">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:configChanges="orientation|screenSize|keyboardHidden"
                      android:screenOrientation="portrait">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          # MainActivity.java
          cat << 'EOF' > app/src/main/java/com/ammar/puzzle/MainActivity.java
          package com.ammar.puzzle;

          import android.app.Activity;
          import android.os.Bundle;
          import android.view.Window;
          import android.view.WindowManager;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;

          public class MainActivity extends Activity {
              private WebView webView;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  requestWindowFeature(Window.FEATURE_NO_TITLE);
                  getWindow().setFlags(WindowManager.LayoutParams.FLAG_FULLSCREEN, WindowManager.LayoutParams.FLAG_FULLSCREEN);

                  webView = new WebView(this);
                  setContentView(webView);

                  WebSettings settings = webView.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setAllowFileAccess(true);

                  webView.setWebViewClient(new WebViewClient());
                  webView.loadUrl("file:///android_asset/index.html");
              }

              @Override
              public void onBackPressed() {
                  if (webView.canGoBack()) webView.goBack();
                  else super.onBackPressed();
              }
          }
          EOF

          # strings.xml
          cat << 'EOF' > app/src/main/res/values/strings.xml
          <resources><string name="app_name">لعبة الألغاز العربية</string></resources>
          EOF

          # أيقونة التطبيق الذهبية
          python3 -c "
          import zlib, struct
          def make_png(w, h, c):
              raw = bytearray()
              for y in range(h):
                  raw.append(0)
                  for x in range(w):
                      d = ((x-w/2)**2 + (y-h/2)**2)**0.5
                      raw.extend([255, 183, 3] if d < w*0.45 else c)
              comp = zlib.compress(raw)
              def chunk(tag, data):
                  return struct.pack('>I', len(data)) + tag + data + struct.pack('>I', zlib.crc32(tag+data)&0xffffffff)
              return b'\x89PNG\r\n\x1a\n' + chunk(b'IHDR', struct.pack('>IIBBBBB', w, h, 8, 2, 0, 0, 0)) + chunk(b'IDAT', comp) + chunk(b'IEND', b'')
          with open('app/src/main/res/mipmap-hdpi/ic_launcher.png', 'wb') as f:
              f.write(make_png(72, 72, (251, 133, 0)))
          "

          # نقل ملف اللعبة إلى أصول أندرويد
          cp index.html app/src/main/assets/index.html
          echo "تم تجهيز ملفات اللعبة بنجاح."

      - name: تجميع ملف التطبيق (Build APK)
        run: |
          ./gradle-8.5/bin/gradle assembleDebug --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk Ammar-Arabic-Puzzle-Game-v1.0.apk
          ls -lh Ammar-Arabic-Puzzle-Game-v1.0.apk

      - name: رفع ملف التطبيق كملف قابل للتحميل (Upload APK Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: Ammar-Arabic-Puzzle-Game-APK
          path: Ammar-Arabic-Puzzle-Game-v1.0.apk
          retention-days: 30
