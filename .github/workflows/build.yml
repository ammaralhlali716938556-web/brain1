name: Build Arabic Mobile Puzzle Game APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Generate & Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Scaffold Android Game Project
        run: |
          # Create directory structure
          mkdir -p app/src/main/java/com/ammar/puzzle
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/assets

          # 1. Root build.gradle
          cat << 'EOF' > build.gradle
          buildscript {
              repositories {
                  google()
                  mavenCentral()
              }
              dependencies {
                  classpath 'com.android.tools.build:gradle:8.2.2'
                  classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.22'
              }
          }
          allprojects {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          EOF

          # 2. settings.gradle
          cat << 'EOF' > settings.gradle
          rootProject.name = "AlghazAmmar"
          include ':app'
          EOF

          # 3. gradle.properties
          cat << 'EOF' > gradle.properties
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.enableJetifier=true
          EOF

          # 4. app/build.gradle
          cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
              id 'kotlin-android'
          }

          android {
              namespace 'com.ammar.puzzle'
              compileSdk 34

              defaultConfig {
                  applicationId "com.ammar.puzzle"
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName "1.0.0"
              }

              buildTypes {
                  release {
                      minifyEnabled false
                      proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
                  }
                  debug {
                      applicationIdSuffix ""
                      debuggable true
                  }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = '17'
              }
          }

          dependencies {
              implementation 'androidx.core:core-ktx:1.12.0'
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.11.0'
              implementation 'androidx.webkit:webkit:1.10.0'
          }
          EOF

          # 5. AndroidManifest.xml
          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.VIBRATE" />

              <application
                  android:allowBackup="true"
                  android:icon="@drawable/ic_launcher"
                  android:label="تحدي العقول - ألغاز عربية"
                  android:roundIcon="@drawable/ic_launcher"
                  android:supportsRtl="true"
                  android:theme="@style/Theme.PuzzleGame">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:screenOrientation="portrait"
                      android:configChanges="orientation|screenSize|keyboardHidden">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          # 6. Android Styles & Icons
          cat << 'EOF' > app/src/main/res/values/themes.xml
          <resources>
              <style name="Theme.PuzzleGame" parent="Theme.MaterialComponents.Light.NoActionBar">
                  <item name="android:statusBarColor">#FF5722</item>
                  <item name="android:navigationBarColor">#2A1800</item>
              </style>
          </resources>
          EOF

          cat << 'EOF' > app/src/main/res/drawable/ic_launcher.xml
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path
                  android:fillColor="#FF5722"
                  android:pathData="M0,0h108v108h-108z"/>
              <path
                  android:fillColor="#FFD700"
                  android:pathData="M54,18 L86,36 L86,72 L54,90 L22,72 L22,36 Z"/>
              <path
                  android:fillColor="#FFFFFF"
                  android:pathData="M54,28 L76,41 L76,67 L54,80 L32,67 L32,41 Z"/>
          </vector>
          EOF

          # 7. MainActivity.kt (with Native Webview & Vibration bridge)
          cat << 'EOF' > app/src/main/java/com/ammar/puzzle/MainActivity.kt
          package com.ammar.puzzle

          import android.annotation.SuppressLint
          import android.content.Context
          import android.os.Build
          import android.os.Bundle
          import android.os.VibrationEffect
          import android.os.Vibrator
          import android.webkit.JavascriptInterface
          import android.webkit.WebChromeClient
          import android.webkit.WebSettings
          import android.webkit.WebView
          import android.webkit.WebViewClient
          import androidx.appcompat.app.AppCompatActivity

          class MainActivity : AppCompatActivity() {
              private lateinit var webView: WebView

              @SuppressLint("SetJavaScriptEnabled")
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  supportActionBar?.hide()

                  webView = WebView(this)
                  setContentView(webView)

                  val settings: WebSettings = webView.settings
                  settings.javaScriptEnabled = true
                  settings.domStorageEnabled = true
                  settings.allowFileAccess = true
                  settings.allowContentAccess = true
                  settings.mediaPlaybackRequiresUserGesture = false
                  settings.useWideViewPort = true
                  settings.loadWithOverviewMode = true

                  webView.webViewClient = WebViewClient()
                  webView.webChromeClient = WebChromeClient()
                  webView.addJavascriptInterface(WebAppInterface(this), "AndroidNative")

                  webView.loadUrl("file:///android_asset/index.html")
              }

              inner class WebAppInterface(private val context: Context) {
                  @JavascriptInterface
                  fun vibrate(milliseconds: Long) {
                      val vibrator = context.getSystemService(Context.VIBRATOR_SERVICE) as? Vibrator
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                          vibrator?.vibrate(VibrationEffect.createOneShot(milliseconds, VibrationEffect.DEFAULT_AMPLITUDE))
                      } else {
                          @Suppress("DEPRECATION")
                          vibrator?.vibrate(milliseconds)
                      }
                  }
              }

              @Deprecated("Deprecated in Java")
              override fun onBackPressed() {
                  if (webView.canGoBack()) {
                      webView.goBack()
                  } else {
                      super.onBackPressed()
                  }
              }
          }
          EOF

      - name: Generate High-End HTML5 Arabic Game Engine
        run: |
          cat << 'EOF' > app/src/main/assets/index.html
          <!DOCTYPE html>
          <html lang="ar" dir="rtl">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
            <title>تحدي العقول - ألغاز عربية</title>
            <style>
              :root {
                --bg-gradient: linear-gradient(180deg, #FF5722 0%, #FF9800 45%, #FFB300 85%, #FFC107 100%);
                --accent-blue: #00D2FF;
                --accent-green: #00E676;
                --accent-gold: #FFD700;
                --text-main: #3E1E04;
                --clay-bg: rgba(255, 255, 255, 0.24);
                --clay-border: rgba(255, 255, 255, 0.6);
                --clay-shadow: 0 10px 25px rgba(0, 0, 0, 0.22), inset 0 2px 4px rgba(255, 255, 255, 0.7);
              }

              * {
                box-sizing: border-box;
                user-select: none;
                -webkit-user-select: none;
                -webkit-tap-highlight-color: transparent;
                margin: 0;
                padding: 0;
                font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, Tahoma, sans-serif;
              }

              body {
                background: var(--bg-gradient);
                min-height: 100vh;
                overflow-x: hidden;
                color: var(--text-main);
                display: flex;
                justify-content: center;
                align-items: center;
                direction: rtl;
              }

              #app-container {
                width: 100%;
                max-width: 440px;
                height: 100vh;
                background: var(--bg-gradient);
                position: relative;
                overflow-y: auto;
                overflow-x: hidden;
                display: flex;
                flex-direction: column;
                box-shadow: 0 0 35px rgba(0, 0, 0, 0.35);
              }

              header {
                position: sticky;
                top: 0;
                z-index: 20;
                display: flex;
                justify-content: space-between;
                align-items: center;
                padding: 12px 16px;
                background: rgba(255, 255, 255, 0.2);
                backdrop-filter: blur(12px);
                -webkit-backdrop-filter: blur(12px);
                border-bottom: 2px solid rgba(255, 255, 255, 0.35);
              }

              .badge-pill {
                display: flex;
                align-items: center;
                gap: 6px;
                padding: 6px 14px;
                background: linear-gradient(180deg, #FFFFFF 0%, #FFF3E0 100%);
                border-radius: 50px;
                border: 2px solid #FFE082;
                box-shadow: 0 4px 0 #D7A100, 0 6px 12px rgba(0, 0, 0, 0.15);
                font-weight: 800;
                font-size: 15px;
                color: #795548;
              }
              .badge-pill.coin { color: #B26A00; }

              .icon-btn {
                width: 44px;
                height: 44px;
                border-radius: 50%;
                border: 2px solid #FFF8E1;
                background: linear-gradient(180deg, #FFE082 0%, #FF9800 100%);
                box-shadow: 0 4px 0 #C66900, 0 6px 10px rgba(0, 0, 0, 0.2);
                display: flex;
                align-items: center;
                justify-content: center;
                font-size: 20px;
                cursor: pointer;
                color: #FFFFFF;
                transition: all 0.1s ease;
              }
              .icon-btn:active {
                transform: translateY(3px);
                box-shadow: 0 1px 0 #C66900;
              }

              .screen {
                position: relative;
                z-index: 10;
                padding: 16px;
                flex: 1;
                display: flex;
                flex-direction: column;
                animation: fadeIn 0.25s ease;
              }
              @keyframes fadeIn {
                from { opacity: 0; transform: translateY(8px); }
                to { opacity: 1; transform: translateY(0); }
              }

              .hidden { display: none !important; }

              .btn-3d {
                border: none;
                border-radius: 18px;
                padding: 14px 20px;
                font-size: 17px;
                font-weight: 800;
                color: #FFFFFF;
                text-shadow: 0 2px 3px rgba(0, 0, 0, 0.35);
                cursor: pointer;
                display: inline-flex;
                align-items: center;
                justify-content: center;
                gap: 10px;
                transition: all 0.1s ease;
                position: relative;
                overflow: hidden;
              }
              .btn-3d::after {
                content: "";
                position: absolute;
                top: 2px;
                left: 10%;
                width: 80%;
                height: 35%;
                background: linear-gradient(180deg, rgba(255, 255, 255, 0.6) 0%, rgba(255, 255, 255, 0.05) 100%);
                border-radius: 12px;
                pointer-events: none;
              }
              .btn-3d:active { transform: translateY(4px); }

              .btn-green {
                background: linear-gradient(180deg, #69F0AE 0%, #00E676 60%, #00C853 100%);
                box-shadow: 0 6px 0 #007E33, 0 8px 15px rgba(0, 0, 0, 0.25);
              }
              .btn-green:active { box-shadow: 0 2px 0 #007E33; }

              .btn-blue {
                background: linear-gradient(180deg, #40C4FF 0%, #00B0FF 60%, #0091EA 100%);
                box-shadow: 0 6px 0 #01579B, 0 8px 15px rgba(0, 0, 0, 0.25);
              }
              .btn-blue:active { box-shadow: 0 2px 0 #01579B; }

              .btn-orange {
                background: linear-gradient(180deg, #FFD54F 0%, #FFA000 60%, #FF6F00 100%);
                box-shadow: 0 6px 0 #BF360C, 0 8px 15px rgba(0, 0, 0, 0.25);
              }
              .btn-orange:active { box-shadow: 0 2px 0 #BF360C; }

              .btn-red {
                background: linear-gradient(180deg, #FF8A80 0%, #FF5252 60%, #D50000 100%);
                box-shadow: 0 6px 0 #8B0000, 0 8px 15px rgba(0, 0, 0, 0.25);
              }
              .btn-red:active { box-shadow: 0 2px 0 #8B0000; }

              .clay-card {
                background: var(--clay-bg);
                backdrop-filter: blur(14px);
                border: 2px solid var(--clay-border);
                border-radius: 24px;
                padding: 16px;
                box-shadow: var(--clay-shadow);
                margin-bottom: 14px;
              }

              .stage-hero { text-align: center; margin-bottom: 16px; }
              .stage-title { font-size: 26px; font-weight: 900; color: #FFFFFF; text-shadow: 0 2px 4px rgba(0, 0, 0, 0.35); }
              .stage-subtitle { font-size: 14px; font-weight: 700; color: #FFF3E0; }

              .progress-box {
                background: rgba(0, 0, 0, 0.25);
                border-radius: 50px;
                padding: 4px 6px;
                display: flex;
                gap: 6px;
                margin-top: 10px;
                border: 1px solid rgba(255, 255, 255, 0.3);
              }
              .prog-step {
                flex: 1;
                height: 12px;
                background: rgba(255, 255, 255, 0.25);
                border-radius: 10px;
                transition: all 0.3s ease;
              }
              .prog-step.done {
                background: linear-gradient(90deg, #00E676, #76FF03);
                box-shadow: 0 0 10px #76FF03;
              }

              .pass-criteria {
                margin-top: 6px;
                font-size: 13px;
                font-weight: 800;
                color: #FFECB3;
                text-align: center;
              }

              .modes-grid {
                display: grid;
                grid-template-columns: repeat(2, 1fr);
                gap: 12px;
                margin-bottom: 16px;
              }

              .mode-card {
                background: linear-gradient(160deg, rgba(255, 255, 255, 0.95) 0%, rgba(255, 248, 225, 0.9) 100%);
                border-radius: 20px;
                padding: 14px 10px;
                display: flex;
                flex-direction: column;
                align-items: center;
                text-align: center;
                cursor: pointer;
                border: 2px solid #FFE082;
                box-shadow: 0 6px 0 #E0A800, 0 10px 18px rgba(0, 0, 0, 0.15);
                transition: all 0.15s ease;
              }
              .mode-card:active { transform: translateY(4px); box-shadow: 0 2px 0 #E0A800; }
              .mode-card.completed {
                border-color: #69F0AE;
                box-shadow: 0 6px 0 #00A352, 0 10px 18px rgba(0, 230, 118, 0.25);
                background: linear-gradient(160deg, #F1F8E9 0%, #E8F5E9 100%);
              }

              .badge-icon {
                width: 52px;
                height: 52px;
                border-radius: 50%;
                background: linear-gradient(180deg, #FFFFFF 0%, #FFE082 100%);
                border: 3px solid #FFD700;
                box-shadow: inset 0 2px 4px rgba(255, 255, 255, 0.8), 0 4px 8px rgba(0, 0, 0, 0.15);
                display: flex;
                align-items: center;
                justify-content: center;
                font-size: 26px;
                margin-bottom: 8px;
              }

              .mode-name { font-size: 15px; font-weight: 800; color: #3E2723; }
              .mode-desc { font-size: 11px; font-weight: 600; color: #795548; margin-bottom: 8px; }
              .mode-tag {
                font-size: 11px;
                font-weight: 800;
                padding: 4px 10px;
                border-radius: 20px;
                color: #FFFFFF;
                background: linear-gradient(180deg, #FFB300, #FB8C00);
                box-shadow: 0 2px 0 #E65100;
              }
              .mode-card.completed .mode-tag {
                background: linear-gradient(180deg, #00E676, #00C853);
                box-shadow: 0 2px 0 #007E33;
              }

              .challenge-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
              .challenge-box {
                background: rgba(255, 255, 255, 0.95);
                border-radius: 24px;
                border: 3px solid #FFE082;
                padding: 20px 16px;
                box-shadow: 0 8px 0 #E0A800, 0 14px 25px rgba(0, 0, 0, 0.2);
                margin-bottom: 18px;
                text-align: center;
              }
              .challenge-q-title { font-size: 14px; font-weight: 800; color: #FB8C00; margin-bottom: 6px; }
              .challenge-question { font-size: 20px; font-weight: 900; color: #3E2723; line-height: 1.45; }

              /* Mode 1: Hexagonal Word Tiles */
              .word-slots { display: flex; justify-content: center; gap: 8px; flex-wrap: wrap; margin: 16px 0; min-height: 52px; }
              .letter-slot {
                width: 44px;
                height: 48px;
                border-radius: 12px;
                background: #FFF8E1;
                border: 2px dashed #FFA000;
                display: flex;
                align-items: center;
                justify-content: center;
                font-size: 22px;
                font-weight: 800;
                color: #E65100;
                cursor: pointer;
              }
              .letter-slot.filled {
                border: 2px solid #FF8F00;
                background: linear-gradient(180deg, #FFFDE7, #FFF59D);
                box-shadow: 0 3px 0 #E65100;
              }
              .hex-keyboard { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; max-width: 320px; margin: 0 auto 16px; }
              .hex-tile {
                width: 54px;
                height: 58px;
                background: linear-gradient(180deg, #FFE082 0%, #FFA000 65%, #FF8F00 100%);
                clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
                display: flex;
                align-items: center;
                justify-content: center;
                font-size: 22px;
                font-weight: 900;
                color: #3E1B00;
                cursor: pointer;
                filter: drop-shadow(0 5px 0 #C66900);
                transition: all 0.12s ease;
              }
              .hex-tile:active { transform: translateY(3px); filter: drop-shadow(0 2px 0 #C66900); }
              .hex-tile.disabled { opacity: 0.25; pointer-events: none; filter: grayscale(1); }

              /* Mode 2: Memory Grid */
              .memory-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; max-width: 330px; margin: 10px auto; }
              .mem-card { width: 68px; height: 68px; perspective: 800px; cursor: pointer; }
              .mem-inner { width: 100%; height: 100%; position: relative; transform-style: preserve-3d; transition: transform 0.35s ease; border-radius: 16px; }
              .mem-card.flipped .mem-inner { transform: rotateY(180deg); }
              .mem-front, .mem-back {
                position: absolute;
                width: 100%;
                height: 100%;
                backface-visibility: hidden;
                border-radius: 16px;
                display: flex;
                align-items: center;
                justify-content: center;
                font-size: 28px;
              }
              .mem-back {
                background: linear-gradient(135deg, #FFB300 0%, #FF6F00 100%);
                border: 2px solid #FFF8E1;
                box-shadow: 0 5px 0 #BF360C, 0 6px 12px rgba(0,0,0,0.15);
                color: #FFF;
                font-weight: 900;
              }
              .mem-front {
                background: #FFFFFF;
                border: 3px solid #69F0AE;
                box-shadow: 0 5px 0 #00A352;
                transform: rotateY(180deg);
              }

              /* Mode 3, 5, 6: Multiple Choice Options */
              .options-grid { display: flex; flex-direction: column; gap: 10px; width: 100%; }
              .option-btn {
                width: 100%;
                padding: 14px 18px;
                border-radius: 18px;
                border: 2px solid #FFE082;
                background: linear-gradient(180deg, #FFFFFF 0%, #FFF8E1 100%);
                box-shadow: 0 5px 0 #E0A800, 0 8px 14px rgba(0, 0, 0, 0.12);
                font-size: 18px;
                font-weight: 800;
                color: #3E2723;
                text-align: right;
                cursor: pointer;
                display: flex;
                align-items: center;
                justify-content: space-between;
                transition: all 0.12s ease;
              }
              .option-btn:active { transform: translateY(3px); box-shadow: 0 2px 0 #E0A800; }
              .option-btn.correct { background: linear-gradient(180deg, #E8F5E9, #C8E6C9); border-color: #00E676; box-shadow: 0 5px 0 #007E33; color: #1B5E20; }
              .option-btn.wrong { background: linear-gradient(180deg, #FFEBEE, #FFCDD2); border-color: #FF5252; box-shadow: 0 5px 0 #B71C1C; color: #B71C1C; }

              /* Mode 4: Observation Grid */
              .obs-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; max-width: 320px; margin: 10px auto; }
              .obs-item {
                width: 65px;
                height: 65px;
                border-radius: 50%;
                background: linear-gradient(180deg, #FFFFFF 0%, #FFF8E1 100%);
                border: 3px solid #FFD54F;
                box-shadow: 0 4px 0 #E0A800, 0 6px 12px rgba(0,0,0,0.1);
                display: flex;
                align-items: center;
                justify-content: center;
                font-size: 30px;
                cursor: pointer;
                transition: transform 0.1s ease;
              }
              .obs-item:active { transform: scale(0.92); }

              /* Modals & Overlays */
              .modal-overlay {
                position: absolute;
                top: 0; left: 0; right: 0; bottom: 0;
                background: rgba(0, 0, 0, 0.65);
                backdrop-filter: blur(8px);
                z-index: 50;
                display: flex;
                align-items: center;
                justify-content: center;
                padding: 20px;
                animation: fadeIn 0.2s ease;
              }
              .modal-card {
                width: 100%;
                max-width: 380px;
                background: linear-gradient(180deg, #FFFDE7 0%, #FFF8E1 50%, #FFE082 100%);
                border-radius: 28px;
                border: 4px solid #FFD700;
                box-shadow: 0 12px 0 #B28900, 0 20px 40px rgba(0, 0, 0, 0.4);
                padding: 24px 20px;
                text-align: center;
              }
              .modal-header-icon {
                width: 76px;
                height: 76px;
                border-radius: 50%;
                background: linear-gradient(180deg, #FFFFFF 0%, #FFE082 100%);
                border: 4px solid #FFD700;
                box-shadow: 0 6px 0 #B28900, 0 10px 20px rgba(0,0,0,0.2);
                display: flex;
                align-items: center;
                justify-content: center;
                font-size: 38px;
                margin: -50px auto 14px;
              }
              .modal-title { font-size: 24px; font-weight: 900; color: #3E1B00; margin-bottom: 8px; }
              .modal-body { font-size: 15px; font-weight: 700; color: #5D4037; line-height: 1.6; margin-bottom: 20px; }

              .setting-row {
                display: flex;
                align-items: center;
                justify-content: space-between;
                padding: 10px 0;
                border-bottom: 1px solid rgba(0, 0, 0, 0.08);
                font-size: 16px;
                font-weight: 800;
                color: #4E342E;
              }
              .switch-btn {
                width: 54px;
                height: 30px;
                background: #BDBDBD;
                border-radius: 30px;
                position: relative;
                cursor: pointer;
                transition: background 0.25s ease;
              }
              .switch-btn.on { background: #00E676; }
              .switch-thumb {
                width: 24px;
                height: 24px;
                background: #FFFFFF;
                border-radius: 50%;
                position: absolute;
                top: 3px;
                right: 3px;
                transition: transform 0.25s ease;
                box-shadow: 0 2px 5px rgba(0,0,0,0.25);
              }
              .switch-btn.on .switch-thumb { transform: translateX(-24px); }

